- id: linux-basic-001
  topic: boot process
  difficulty: beginner
  question: Walk through what happens between pressing the power button and getting a login prompt.
  answer: |
    Firmware (UEFI or BIOS) runs POST, initialises devices, and — on UEFI — reads boot entries from
    NVRAM (`efibootmgr -v`) to load an EFI binary from the EFI System Partition. That binary is GRUB
    (or systemd-boot), which reads its config (`/boot/grub/grub.cfg`, generated by `update-grub` or
    `grub2-mkconfig`) and loads a kernel plus an initramfs into memory, passing the kernel command
    line from the menu entry.

    The kernel initialises memory, mounts the initramfs as a temporary root, and runs its `/init`.
    That small userland loads the storage, LUKS and network modules needed to find the real root
    filesystem, mounts it, and `switch_root`s into it.

    From there systemd starts as PID 1, applies its unit graph, mounts what `/etc/fstab` lists, and
    pulls in `default.target` — usually a symlink to `multi-user.target` — which brings up the getty
    and SSH. Failures at each stage look distinct: a firmware problem shows no bootloader, a missing
    initramfs driver gives `VFS: Unable to mount root fs`, and a bad fstab lands in
    `emergency.target`.
  tags: [boot, grub, initramfs, systemd]

- id: linux-basic-002
  topic: systemd units
  difficulty: intermediate
  question: What is the difference between After= and Requires= in a unit file?
  answer: |
    They answer different questions. `Requires=` (and `Wants=`) control *whether* another unit is
    pulled in; `After=` and `Before=` control *when* it starts relative to this one.

    `After=postgresql.service` alone guarantees only ordering — if Postgres happens to be starting, wait
    for it; if nothing pulls it in, the ordering is vacuous. `Requires=postgresql.service` alone starts
    Postgres but does not wait, so both may come up in parallel and your service still fails to
    connect. The correct pattern is both:

    ```ini
    [Unit]
    Wants=postgresql.service
    After=network-online.target postgresql.service
    ```

    `Wants=` is the softer form: a failed dependency does not fail this unit, which is usually what you
    want for optional services. `Requires=` propagates stop and failure, and it is easy to create a
    stop cascade by accident — for a web app depending on a database, `Wants=` plus a retry loop in the
    application is more robust than `Requires=` plus a hard failure.
  tags: [systemd, ordering, dependencies]

- id: linux-basic-003
  topic: systemd operations
  difficulty: beginner
  question: What is the difference between enable, start, and daemon-reload — and why does an edited unit seem to be ignored?
  answer: |
    `enable` creates the symlink under `multi-user.target.wants/` (via `[Install] WantedBy=`) so the
    unit starts at boot; it does not start anything now. `start` starts it in this boot without
    changing what happens next boot. `enable --now` does both.

    `daemon-reload` tells PID 1 to re-read unit files from disk. Without it, systemd is still running
    the version it parsed at boot: you edit `ExecStart=`, restart the service, and the old command runs
    again. After adding a drop-in with `systemctl edit`, always
    `systemctl daemon-reload && systemctl restart <unit>`.

    Two related distinctions: `restart` stops then starts (a real interruption, `SIGTERM` then
    `SIGKILL` after `TimeoutStopSec`), while `reload` sends `SIGHUP` and only works if the unit defines
    `ExecReload=`. And `mask` symlinks the unit to `/dev/null`, which survives package reinstalls —
    stronger than `disable` when a dependency keeps pulling a service back in.
  tags: [systemctl, enable, daemon-reload, drop-in]

- id: linux-basic-004
  topic: signals
  difficulty: beginner
  question: Why is kill -9 considered a last resort, and what happens when it does not work?
  answer: |
    `SIGKILL` cannot be caught, blocked, or handled, so the process gets no chance to flush buffers,
    close database connections, release lock files, or write a shutdown log line. For a database or a
    queue worker that means torn writes and orphaned state; for a web server it means dropped
    connections instead of drained ones.

    `SIGTERM` is the request to stop, and well-written daemons handle it by finishing in-flight work.
    That is exactly what `systemctl stop` sends first, escalating to `SIGKILL` after `TimeoutStopSec`
    (90 s by default) if the process is still alive.

    When `kill -9` appears to do nothing, the process is almost always in `D` state — uninterruptible
    sleep inside a kernel call, usually storage or NFS. Signals are delivered on return to user space,
    and a `D` process never returns. Check `ps -o stat,wchan` and `dmesg`; the fix is the storage or the
    mount, not a stronger signal. A `Z` state zombie is already dead and cannot be killed at all — you
    restart the parent that is failing to reap it.
  tags: [signals, sigkill, sigterm, d-state]

- id: linux-basic-005
  topic: processes
  difficulty: beginner
  question: What is a zombie process, and why does killing it not help?
  answer: |
    A zombie is an entry left in the process table after a child has exited but before its parent has
    called `wait()` to collect the exit status. It holds no memory and no CPU — only a PID and a status
    code — so it is not consuming resources, but it cannot be scheduled or signalled. `kill -9` does
    nothing because there is no process left to kill; the process has already terminated.

    Zombies are reaped by the parent, or reparented to PID 1 when the parent dies, and systemd reaps
    its children correctly. So a handful is normal; a *growing* count means a long-running parent has a
    bug — it forks workers and never waits. Find it with:

    ```bash
    ps -eo stat,ppid,pid,cmd | awk '$1 ~ /^Z/ {print $2}' | sort | uniq -c
    ```

    The fix is to restart or fix the parent. In containers the same problem appears when PID 1 is a
    shell script that does not reap orphans, which is why `--init` (tini) exists. A full PID table from
    leaked zombies eventually prevents new processes from starting.
  tags: [zombie, fork, reaping, pid-1]

- id: linux-basic-006
  topic: performance
  difficulty: intermediate
  question: What does load average actually measure, and how do you interpret 8.0 on a 4-core server?
  answer: |
    It is the exponentially weighted average number of tasks that were runnable (`R`) or in
    uninterruptible sleep (`D`) over 1, 5 and 15 minutes. It is a queue length, not a percentage, and
    it is not normalised by core count.

    On 4 cores, a sustained 8.0 means roughly eight tasks wanted CPU at once while four could run —
    about twice the capacity, so requests queue and latency climbs. 4.0 is full utilisation with no
    headroom. On a 32-core host, the same 8.0 is unremarkable.

    The second half of the definition is what people miss: `D`-state tasks count. Load 12 with 5% CPU
    utilisation is not a CPU problem at all — it is a storage or NFS stall, and `vmstat 1` will show
    `b` (blocked) above zero with high `wa`. Compare `r` and `b` before touching the CPU.

    Also check `%st` in a VM. High steal means the hypervisor is not scheduling your vCPU, and no
    guest-side tuning will fix it. Rising 1-minute with flat 15-minute averages means the problem
    started minutes ago.
  tags: [load-average, runqueue, d-state, capacity]

- id: linux-basic-007
  topic: cgroups
  difficulty: intermediate
  question: How do cgroup v2 CPU and memory limits actually work on a systemd host?
  answer: |
    cgroup v2 is one unified hierarchy at `/sys/fs/cgroup`, and each systemd unit gets a directory
    under `system.slice` or `user.slice`. Limits are files, not opaque settings:

    - `memory.max` is the hard cap; exceeding it invokes the cgroup OOM killer. `memory.high` is the
      soft cap that throttles and forces reclaim first.
    - `cpu.max` holds `"<quota> <period>"` in microseconds. `"200000 100000"` means 2 CPUs' worth of
      runtime per 100 ms period.
    - `pids.max` caps processes and threads, which is a fork-bomb defence.

    The important subtlety is that `cpu.max` is a quota *per period*, not a smoothed rate. A service
    that needs slightly more than its quota inside one 100 ms window is throttled to zero until the
    next period, which shows up as p99 latency spikes at modest average utilisation. Check
    `nr_throttled` in `cpu.stat` before blaming the application.

    Limits are accounting and throttling, not isolation — a process can still see the whole machine.
    Set them per unit with `MemoryMax=`, `CPUQuota=`, `TasksMax=`, or ad hoc with
    `systemd-run --scope -p MemoryMax=2G`.
  tags: [cgroups, cpu-quota, memory-max, throttling]

- id: linux-basic-008
  topic: limits
  difficulty: intermediate
  question: A service still reports "too many open files" after you raised nofile in limits.conf. Why?
  answer: |
    Because systemd-started services never go through PAM, and `/etc/security/limits.conf` is applied
    by `pam_limits` during a login session. It affects interactive shells and things started from them,
    not units started by PID 1.

    Raise the limit on the unit instead:

    ```ini
    [Service]
    LimitNOFILE=65535
    ```

    then `systemctl daemon-reload && systemctl restart app`, and verify from inside the process rather
    than from your shell:

    ```bash
    grep 'open files' /proc/$(pgrep -o app)/limits
    ```

    There are four independent layers to keep straight: `ulimit` in a shell (session only),
    `limits.conf` (PAM sessions), `LimitNOFILE=` (the unit's cgroup/rlimit), and `fs.file-max` (the
    kernel-wide ceiling, set in `/etc/sysctl.d/`). A value above `fs.file-max` fails or is clamped, and
    `systemctl show app -p LimitNOFILE` shows what systemd believes it set.

    Also check for a file-descriptor leak: `ls /proc/<pid>/fd | wc -l` growing over time is the real
    bug, and raising the limit only delays it.
  tags: [ulimit, nofile, systemd, pam-limits]

- id: linux-basic-009
  topic: filesystems
  difficulty: intermediate
  question: When would you choose XFS over ext4, and what are the operational consequences?
  answer: |
    XFS is the default on RHEL-family systems and ext4 on Debian/Ubuntu. XFS scales better with large
    files, high parallelism and many concurrent writers: it uses allocation groups so metadata updates
    spread across the device, and it has a long history in large storage stacks. ext4 is simpler, has
    more mature recovery tooling, and handles millions of small files and directory-heavy workloads
    well.

    The operational difference that bites is resizing: both grow online (`xfs_growfs /mount` versus
    `resize2fs /dev/vg/lv`), but **XFS cannot shrink**. A 500 GB XFS volume is 500 GB forever; ext4 can
    be shrunk offline. Size XFS LVs conservatively and grow later.

    Others worth knowing: XFS has no `fsck` in the traditional sense — repair is `xfs_repair` on an
    unmounted device, and `fsck.xfs` in fstab is a stub, so the `pass` column is 0. XFS also cannot be
    mounted with ext4's `data=journal`, and its inode count is dynamic rather than fixed at mkfs time,
    which is an advantage over ext4's `df -i` ceiling on file-heavy volumes.

    For a general-purpose application server either is fine; choose what the distribution supports and
    its tooling expects.
  tags: [xfs, ext4, resize, fsck]

- id: linux-basic-010
  topic: mounts
  difficulty: intermediate
  question: Which /etc/fstab options decide whether a server survives a reboot with a missing disk?
  answer: |
    `nofail` is the one that matters. Without it, systemd treats the mount as required, fails
    `local-fs.target`, and drops to `emergency.target` with a read-only root — so a detached cloud
    volume means no SSH. With `nofail`, the boot continues and the mount is simply absent.

    Three companions:

    - `x-systemd.device-timeout=10s` bounds how long the boot waits for a device that may never appear
      (the default is 90 s, multiplied across devices).
    - `_netdev` (or `x-systemd.requires=network-online.target`) stops systemd trying NFS before the
      network exists.
    - `x-systemd.automount` mounts on first access, which keeps boot fast and tolerates a share that is
      down at boot.

    Also use `UUID=` or an LVM path rather than `/dev/sdb`, and set `pass` to 0 for XFS, btrfs and
    network mounts. Verify before rebooting with `mount -a` and `findmnt --verify` — a typo in a
    non-`nofail` line is the most common self-inflicted "the server will not boot" incident, and fixing
    it needs console access.
  tags: [fstab, nofail, mounts, boot-failure]

- id: linux-basic-011
  topic: lvm
  difficulty: intermediate
  question: Walk through extending a filesystem on LVM without downtime.
  answer: |
    Confirm what exists and whether the VG has free space:

    ```bash
    lsblk; vgs; lvs
    ```

    If the VG has capacity, grow the logical volume and the filesystem in one step with `-r`, which
    calls the right resize tool for the filesystem:

    ```bash
    lvextend -r -L +50G /dev/vg_data/lv_app
    ```

    If the VG is full, add a device first — `pvcreate /dev/nvme1n1`, `vgextend vg_data /dev/nvme1n1`,
    then extend. The filesystem can be mounted and in use throughout for both ext4 (`resize2fs`) and
    XFS (`xfs_growfs /mountpoint`, note it takes the mount point, not the device).

    The two mistakes to avoid: running `lvextend` without `-r`/`resize2fs`, which grows the block device
    but leaves `df` unchanged; and running the resize before the LV, which fails because the device has
    not grown yet. Verify afterwards with `df -h` and `lvs`. If the volume is on a cloud disk, remember
    the block device itself may also need growing (`growpart`) before LVM sees the new space.
  tags: [lvm, lvextend, resize2fs, xfs-growfs]

- id: linux-basic-012
  topic: disk usage
  difficulty: beginner
  question: df says the filesystem is 100% full but du reports only half the space is used. What is going on?
  answer: |
    Three explanations, in order of likelihood.

    **Deleted files still held open.** A process with an open handle on a deleted file keeps its blocks
    allocated, so the space is real but invisible to `du`, which walks the directory tree. Find them
    with `lsof +L1` (or `lsof | grep deleted`), then restart the holder or truncate through
    `/proc/<pid>/fd/<n>`. This is the classic "log file rotated while the app kept writing" case.

    **Reserved blocks.** ext4 reserves 5% for root by default, which `df` counts as used but ordinary
    files cannot consume. On a data volume, `tune2fs -m 1 /dev/vg/data` reclaims most of it.

    **Different mount namespaces or a hidden mount.** A directory with a filesystem mounted over it
    hides the underlying files, so `du` on the path misses them — check `findmnt` for a mount inside the
    tree you are measuring.

    Add `-x` to `du` so it does not cross filesystem boundaries, and always check `df -i` as well: inode
    exhaustion produces "no space left on device" with plenty of free bytes.
  tags: [df, du, deleted-files, reserved-blocks, inodes]

- id: linux-basic-013
  topic: permissions
  difficulty: beginner
  question: Explain 755 versus 644, and where umask fits in.
  answer: |
    The digits are owner/group/other, each summing read(4), write(2), execute(1). `644` is `rw-r--r--`
    — the owner can write, everyone can read, nobody can execute. `755` is `rwxr-xr-x` — the owner can
    write and execute, everyone else can read and execute.

    The rule of thumb: files that are executed (binaries, scripts, directories) get 755; data files get
    644. Directories need `x` to be traversed at all, which is why `chmod 644` on a directory produces
    "permission denied" when you `cd` into it even though the files look readable.

    `umask` is the mask subtracted from the default creation mode (666 for files, 777 for directories).
    `umask 022` yields 644 and 755; `umask 027` yields 640 and 750, which is the right default for a
    multi-tenant host because it removes all access for "other". Set it in `/etc/profile.d/` or `UMASK`
    in `/etc/login.defs`, not just in a shell rc — and remember that umask only affects new files, never
    existing ones.

    For anything more granular than owner/group/other, use ACLs (`setfacl`) rather than loose modes.
  tags: [permissions, umask, directories, chmod]

- id: linux-basic-014
  topic: permissions
  difficulty: intermediate
  question: What do setuid, setgid and the sticky bit do, and which of them are dangerous?
  answer: |
    All three are the fourth octal digit in front of the mode.

    **setuid (4000)** on a file makes it run with the owner's UID regardless of who executes it —
    `/usr/bin/passwd` needs it to write `/etc/shadow`. It is ignored on shell scripts by design and on
    directories. It is also the classic privilege-escalation target: a setuid-root binary with a bug, or
    one in a user-writable path, is root. Audit with
    `find / -perm -4000 -type f` and prefer file capabilities
    (`setcap cap_net_bind_service=+ep`) for narrow needs.

    **setgid (2000)** on a file runs it with the file's group. On a *directory* it makes new files
    inherit the directory's group instead of the creator's primary group, which is the standard fix for
    shared team directories: `chgrp -R devs /srv/app && chmod 2775 /srv/app`.

    **sticky (1000)** on a directory means only the file's owner (or root) may delete or rename entries
    inside it — that is what makes `/tmp` usable by everyone.

    `ls -l` shows them as `s`/`S` in the execute position and `t`/`T` on directories.
  tags: [setuid, setgid, sticky-bit, capabilities]

- id: linux-basic-015
  topic: sudo
  difficulty: intermediate
  question: How do you give a team sudo rights without handing them root?
  answer: |
    Use a group rule and scope the commands, in a file under `/etc/sudoers.d/` that is validated before
    install:

    ```
    %ops ALL=(root) /bin/systemctl restart api.service, /bin/systemctl status api
    %ops ALL=(root) NOPASSWD: /usr/bin/journalctl -u api *
    ```

    Then `visudo -cf /etc/sudoers.d/20-ops` before it goes live — a syntax error in sudoers locks
    everyone out of sudo.

    The discipline is in the command list. Wildcards are dangerous: `/usr/bin/systemctl *` is
    equivalent to root, because it can link an attacker-written unit or start a shell unit;
    `journalctl *` with a wildcard can read any log, including other services' secrets. Prefer a wrapper
    script with a fixed argument set, owned `root:root` and not group-writable, over a broad binary.

    `NOPASSWD` is a privilege-escalation primitive for anyone who obtains a shell as that user — use it
    for one narrow automation action, not for convenience. `sudo -l` shows the effective rules, and
    every invocation is logged with the full command line in the journal or `/var/log/auth.log`, which
    is the point of sudo over a shared root password.
  tags: [sudo, sudoers, least-privilege, visudo]

- id: linux-basic-016
  topic: pam
  difficulty: advanced
  question: What does PAM actually do, and how would you add a second factor to SSH logins?
  answer: |
    PAM is a shared-library layer between an application that accepts credentials and the system's
    authentication policy. Each service has a stack in `/etc/pam.d/` (`sshd`, `sudo`, `login`), and
    modules are called in order across four types: `auth` (are the credentials valid), `account` (is
    the account allowed now), `session` (what to set up or tear down), and `password`.

    Control flags decide failure behaviour: `required` fails the stack but keeps evaluating (so the user
    cannot tell which factor failed), `requisite` fails immediately, `sufficient` short-circuits on
    success, `optional` is advisory.

    For SSH with TOTP: install `libpam-google-authenticator`, add
    `auth required pam_google_authenticator.so` to `/etc/pam.d/sshd`, set
    `KbdInteractiveAuthentication yes` and
    `AuthenticationMethods publickey,keyboard-interactive` in `sshd_config`, and enrol each user with
    `google-authenticator`. `AuthenticationMethods` is what enforces "both", not the PAM line alone.

    Test in a second session before closing the first, and keep a break-glass path — a PAM misconfig
    locks out every login, including root over SSH.
  tags: [pam, mfa, ssh, totp]

- id: linux-basic-017
  topic: networking
  difficulty: beginner
  question: How do you find out what is listening on a port and which process owns it?
  answer: |
    `ss -tulpen` is the one command to remember: TCP and UDP, listening sockets, numeric ports, with the
    process (`-p`, needs root for other users' processes) and the owning user (`-e`).

    ```
    State  Local Address:Port  Process
    LISTEN 0.0.0.0:5432        users:(("postgres",pid=911,fd=6))
    LISTEN 127.0.0.1:6379      users:(("redis-server",pid=1042,fd=6))
    ```

    Read the bind address carefully: `127.0.0.1:6379` is not reachable from another host no matter what
    the firewall says, while `0.0.0.0:5432` (or `[::]:5432`) is. That single distinction resolves a
    large share of "the port is open but I cannot connect" tickets.

    Useful variants: `ss -tan state established` for current connections, `ss -s` for a summary
    including socket memory, and `ss -tlnp '( sport = :443 )'` for filtering. If `ss` shows nothing but
    connections arrive, the process may be in a different network namespace — check with
    `nsenter -t <pid> -n ss -tulpen` for containerised services (Docker publishes ports via NAT, so the
    listener lives in the container's namespace).
  tags: [ss, ports, listening, namespaces]

- id: linux-basic-018
  topic: firewalls
  difficulty: intermediate
  question: How do nftables, iptables, ufw and firewalld relate to each other?
  answer: |
    nftables is the kernel packet filter, and it is what everything else configures on a current system.
    `iptables` is a compatibility front end (`iptables-nft`) that translates its rules into nftables
    objects, so `iptables -L` and `nft list ruleset` show the same underlying state in different
    syntaxes.

    `ufw` (Ubuntu/Debian) and `firewalld` (RHEL family) are policy managers on top: you say "allow 22,
    deny the rest" and they generate the ruleset, plus zones or application profiles. They are easier to
    reason about and harder to audit precisely.

    Two consequences matter operationally. First, do not mix layers: adding raw `nft` rules on a
    firewalld host leads to two sources of truth that overwrite each other. Second, Docker inserts its
    own DNAT chains in `nat`, which bypass the input chain — a container published with `-p 8080:80` is
    reachable even when `ufw deny 8080` is set. Verify exposure from outside the host, and check
    `nft list ruleset` rather than trusting a single front end's status output.
  tags: [nftables, iptables, ufw, firewalld, docker]

- id: linux-basic-019
  topic: dns
  difficulty: intermediate
  question: How does a name lookup actually resolve on a modern Ubuntu or RHEL host, and where do you debug it?
  answer: |
    Three layers, in order. `getaddrinfo()` consults `/etc/nsswitch.conf` (`hosts: files dns`), so
    `/etc/hosts` is checked before any DNS query. Then the resolver library reads `/etc/resolv.conf` —
    which on a systemd-resolved host is a symlink to a stub file pointing at `127.0.0.53`, where
    `systemd-resolved` answers from its cache and forwards per-link.

    Debug in the same order:

    - `getent hosts name` resolves exactly as applications do, including `/etc/hosts` and NSS modules.
    - `resolvectl status` shows per-link DNS servers, the server actually in use, and DNSSEC state;
      `resolvectl query name` shows which server answered.
    - `resolvectl flush-caches` clears a stale entry after a failover.
    - `dig name` bypasses NSS entirely and asks DNS directly, so a disagreement with `getent` points at
      `/etc/hosts` or `nsswitch.conf`.
    - `dig +trace name` follows the delegation from the root, separating a local resolver problem from an
      authoritative one.

    Also check the `search` list and `ndots`: with `ndots:5`, a short name is tried against every search
    suffix first, which is the classic source of multi-second lookup latency.
  tags: [dns, systemd-resolved, nsswitch, dig]

- id: linux-basic-020
  topic: logging
  difficulty: beginner
  question: Where do logs go on a systemd host, and how do you make sure they survive a reboot?
  answer: |
    systemd-journald collects kernel messages, unit stdout/stderr, and syslog input into a binary,
    structured journal read with `journalctl`. By default on many cloud images the journal is
    *volatile*: it lives in `/run/log/journal` and is erased on reboot, which is exactly when you need
    it.

    Persistence is one directory plus a setting. Create `/var/log/journal` (or set `Storage=persistent`
    in `/etc/systemd/journald.conf`) and restart journald; history then accumulates in
    `/var/log/journal/<machine-id>/`. Cap it at the same time, because an unbounded journal filling
    `/var` is a self-inflicted outage:

    ```ini
    [Journal]
    Storage=persistent
    SystemMaxUse=2G
    MaxRetentionSec=30day
    ```

    Then `journalctl --vacuum-size=2G` trims existing data. Query with `-u <unit>`, `--since`, `-p err`,
    `-b -1` for the previous boot, and `-o json` for shipping. Application logs in `/var/log` still exist
    and still need logrotate; journald's own rotation does not cover them.
  tags: [journald, persistence, retention, journalctl]

- id: linux-basic-021
  topic: packages
  difficulty: beginner
  question: What is the difference between apt upgrade and apt full-upgrade, and when does that matter?
  answer: |
    `apt upgrade` installs new versions of already-installed packages but will *not* remove a package or
    install one that was not already present to satisfy a dependency — if a new version needs that, the
    package is held back. `apt full-upgrade` (formerly `dist-upgrade`) will remove and add packages as
    needed to complete the transaction.

    That distinction matters on hosts with tight dependency constraints: a kernel or libc transition, a
    distribution point release, or a PHP/Python version bump often requires removals, and `upgrade`
    silently leaves you half-patched. Conversely, `full-upgrade` on a production host can remove a
    package you depend on, so read the proposed changes before saying yes (`apt -s full-upgrade` for a
    simulation).

    On the RHEL side the equivalents are `dnf upgrade` with `--allowerasing` for the aggressive form, and
    `dnf distro-sync` to align exactly with the enabled repositories. `apt-cache policy <pkg>` shows
    installed versus candidate and which repo wins, which is the first check when an upgrade is
    unexpectedly held back by pinning.
  tags: [apt, dnf, upgrade, dependencies]

- id: linux-basic-022
  topic: patching
  difficulty: advanced
  question: A vulnerability scanner says your OpenSSL is vulnerable, but the package version looks old. Who is right?
  answer: |
    Usually the distribution is right and the scanner is matching version strings. Distributions
    **backport** security fixes: `openssl 3.0.13-1ubuntu0.4` carries dozens of CVE patches while its
    upstream version still reads 3.0.13. A scanner comparing "installed 3.0.13 vs fixed 3.0.14" produces
    false positives, and occasionally false negatives when a distro patches ahead of upstream.

    The authoritative sources are the distribution's own advisory data: Ubuntu USNs and
    `apt changelog <pkg>`, Red Hat's OVAL/CSAF feeds and `dnf updateinfo info <advisory>`, Debian
    security tracker entries. `apt list --upgradable` after `apt update` is the real answer to "what is
    missing on this host".

    So the workflow is: treat the scanner as a lead, look up the CVE in the distro's tracker, compare
    against the *package revision* the distro says is fixed, and record the conclusion. Where the distro
    will not fix it (end of standard support, or "will not fix" for a low-severity issue), that becomes a
    documented accepted risk with an owner and a date rather than an open ticket nobody can close.
  tags: [backports, cve, scanners, patch-management]

- id: linux-basic-023
  topic: ssh
  difficulty: beginner
  question: How do you harden SSH without locking yourself out?
  answer: |
    Open a second session and keep it open until the new configuration is proven. Then change things in
    this order: get key authentication working for a non-root user, confirm it, then disable passwords.

    The core `sshd_config` settings:

    ```ini
    PermitRootLogin prohibit-password
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowGroups ssh-users
    MaxAuthTries 3
    ```

    Validate with `sshd -t` (syntax) and `sshd -T` (effective values, including defaults), then
    `systemctl reload sshd` — reload keeps existing sessions, restart drops them.

    Details that cause most failures: `authorized_keys` must be `600` and `~/.ssh` `700`, or the key is
    silently ignored; `AllowGroups` must include your account *before* you reload; and
    `KbdInteractiveAuthentication no` is what actually disables PAM password prompts on current OpenSSH.
    Keep a console or out-of-band path, and add a second admin key before removing the first.
  tags: [ssh, hardening, lockout, sshd-config]

- id: linux-basic-024
  topic: memory
  difficulty: intermediate
  question: What happens when a Linux host runs out of memory, and how do you tell an OOM kill from a crash?
  answer: |
    When reclaim cannot satisfy an allocation, the kernel invokes the OOM killer, which scores processes
    by resident memory (`oom_score`, adjustable via `oom_score_adj` from -1000 to 1000) and kills the
    worst offender with `SIGKILL`. Inside a cgroup with `memory.max`, the cgroup OOM killer runs first, so
    a container or unit can die while the host is healthy.

    The tell is a kernel log line naming the process and its RSS:

    ```
    Out of memory: Killed process 8842 (python3) total-vm:8412340kB, anon-rss:3982112kB
    ```

    Check with `journalctl -k -b | grep -i 'killed process'` or `dmesg -T`. A service that exits 137
    *without* that line was killed by something else — systemd's `TimeoutStopSec`, a container runtime, a
    deploy script, or a human. That distinction changes the investigation entirely: the first is a sizing
    or leak problem, the second is a shutdown-path problem.

    Consequences: nothing gets a chance to flush, so a database can need recovery. Protect critical
    services with `OOMScoreAdjust=-900`, and cap the rest with `MemoryMax=` so the victim is the batch job,
    not the database.
  tags: [oom-killer, memory, exit-137, cgroups]
