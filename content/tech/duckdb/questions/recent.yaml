    "topic": "CSV ingestion",
    "difficulty": "intermediate",
    "question": "How do you make CSV ingestion deterministic across changing files?",
    "answer": "Deterministic CSV ingestion requires explicit file selection, schema, parsing options, and malformed-row policy; inference alone can change as new data arrives. Pin a schema or provide an explicit column mapping so a new file cannot silently alter types or column order. For example, test an identifier with leading zeroes, a quoted delimiter inside a field, a timezone-bearing timestamp, and the configured null marker. Maintain an explicit manifest for each ingestion batch and record rejected rows rather than relying on a permissive default. After loading, compare row counts, required-field nulls, and key uniqueness with the source contract. Once validated, writing typed Parquet gives future scans consistent schema and better columnar access. Repeat the same batch to confirm it produces the same values and errors, even when additional unrelated files appear in the directory.",
