    "topic": "threads",
    "difficulty": "intermediate",
    "question": "Why might setting DuckDB threads to the maximum reduce application performance?",
    "answer": "Maximum thread count is not always fastest: parallel queries contend for CPU, memory bandwidth, and I/O, so choose threads from measurements under real concurrency. Start with a moderate thread count and benchmark under the application's expected simultaneous query load. For example, one scan may run faster with eight workers in isolation but perform worse when four such queries compete for the same cores and disk. Compare total completed queries, p95 latency, CPU utilization, storage wait, memory use, and spill volume rather than only one query's wall time. Reserve capacity for the host and other services, and retest after changing container CPU limits or concurrency. More threads help only when the operator has parallel work and the machine can supply resources; they cannot remove an I/O bottleneck or compensate for excessive memory pressure.",
