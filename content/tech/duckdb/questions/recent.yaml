    "difficulty": "intermediate",
    "question": "What happens when a DuckDB query exceeds its memory budget?",
    "answer": "DuckDB can spill some intermediate query state to temporary disk when memory is exhausted, allowing supported operators to finish with more I/O and lower speed. Set the memory limit and temporary directory deliberately, and ensure the temporary volume has space and suitable throughput. A large sort or hash aggregation may spill partitions to that directory, trading RAM use for disk reads and writes; some operations or failure modes still cannot be rescued by spilling. For example, an aggregation that previously ran out of memory may finish slowly when spill is enabled, but a full disk can still fail the query. Profile representative workloads, watch temporary space, and reduce unnecessary intermediate data or concurrent heavy queries. Spilling is a safety mechanism, not a promise of unlimited capacity.",
