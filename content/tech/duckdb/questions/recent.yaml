    "difficulty": "intermediate",
    "question": "How would you diagnose an unexpectedly large join result using EXPLAIN ANALYZE?",
    "answer": "An unexpectedly large join can come from duplicate keys, a missing predicate, or a legitimate many-to-many relationship; EXPLAIN ANALYZE helps locate where row counts expand. For example, if a supposedly unique customer key occurs five times on one side, each matching order can appear five times; the resulting rows may be valid SQL but violate the intended business relationship. Check duplicate counts and join predicates before attempting to fix estimates or add indexes. In the plan, note which operator first expands row count and whether the extra rows amplify memory, sorting, or later joins. Verify the corrected query on fixtures containing duplicate, unmatched, and null keys, then profile realistic data. This separates a correctness bug from an expensive but correct many-to-many join.",
