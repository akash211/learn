    "question": "When is an embedded DuckDB dashboard a poor fit?",
    "answer": "An embedded dashboard is a poor fit when users require coordinated multi-process writes, tenant isolation, resource controls, or database-service availability. For example, a single analyst opening local files and running read-heavy reports is a natural embedded workload. A dashboard deployed with several worker processes, shared mutable state, user-specific permissions, and strict latency objectives needs centralized connection management and resource isolation that an embedded file does not automatically provide. Consider whether one process can own the database and serve controlled queries, or whether users require direct concurrent writes. Test connection lifetime, file access, backups, failure recovery, and tenant boundaries under realistic concurrency. If service-level operations are central, use a client-server database for shared state and retain DuckDB for local analysis or batch transformations.",
