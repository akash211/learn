    "question": "When should semi-structured JSON be transformed into typed STRUCT or relational columns?",
    "answer": "Convert stable, frequently queried JSON fields into typed values or relational columns, while retaining raw payloads when replay or schema flexibility matters. A practical pattern is to retain the raw payload for audit or replay while extracting stable fields once into typed columns for downstream filters and joins. For example, parse an event amount as DECIMAL and its event time as TIMESTAMP instead of repeatedly comparing JSON text. Decide whether missing, explicit null, and invalid values should become SQL NULL, a validation error, or a quarantined record; otherwise conversion can silently change meaning. Schema drift may justify keeping optional fields in raw JSON, while frequently joined identifiers usually belong in relational columns. Exercise the conversion with representative producer versions and malformed records before replacing the existing query path.",
