    "question": "What should be considered before scanning S3 Parquet directly with DuckDB?",
    "answer": "Direct S3 Parquet scans can avoid staging but depend on secure credentials, network access, object layout, and request cost; measure them against local staging. For a recurring scan, date-partitioned files and a manifest can reduce object listings and irrelevant reads; a single query over many tiny objects can instead be dominated by request latency. Prefer a short-lived, least-privilege credential supplied through DuckDB secrets or the deployment's identity mechanism. Check region, endpoint, egress, TLS, retry behavior, and network policy in the actual runtime. A useful test compares direct S3 access with staging a representative subset locally, recording bytes read, elapsed time, and cost. Do not expose credentials in notebooks or saved SQL. Confirm both correctness and access-denied behavior before making the remote source a production dependency.",
