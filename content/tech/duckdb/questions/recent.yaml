    "difficulty": "intermediate",
    "question": "How does projection and predicate pushdown reduce work when querying Parquet?",
    "answer": "Parquet pushdown saves work by avoiding irrelevant columns and row groups before DuckDB processes the remaining data. Projection reduces column reads; eligible filters use file and row-group statistics to skip chunks. In practice, DuckDB can discard whole row groups when statistics show that their values cannot match, and it need not decode columns that the query never selects. For instance, a date filter over partitioned Parquet can skip older files while selecting only a timestamp and revenue column. A function or cast around the filtered column may prevent the storage reader from applying that predicate, so check the physical plan rather than assuming pushdown occurred. Compare scanned rows and bytes with the expected result, including nulls and boundary dates, before tuning file sizes or rewriting expressions.",
