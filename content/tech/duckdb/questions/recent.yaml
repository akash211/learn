    "difficulty": "advanced",
    "question": "What is the practical difference between concurrent connections in one process and multiple processes writing one database file?",
    "answer": "Multiple connections in one DuckDB process can coordinate transactions under its concurrent read/write model; separate processes writing the same file are not an equivalent multi-writer server. The distinction matters operationally: connections within one process share a supported coordination context, while independent processes do not become a transactional server merely because they point at the same file. Optimistic concurrency means conflicting transactions can fail and should be retried only when the application operation is safe to repeat. For example, a local analysis program can use separate connections for readers and a writer, but several web-worker processes concurrently updating one file need a different design. Test the actual deployment and recovery flow; choose a client-server database when multi-process write coordination, remote access, or user isolation is a core requirement.",
