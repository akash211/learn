    "topic": "SQL semantics",
    "difficulty": "intermediate",
    "question": "How do QUALIFY, window frames, and tie-breaking interact when selecting latest rows?",
    "answer": "Latest-row queries need a complete deterministic order and an explicit window frame; QUALIFY filters the window result but cannot resolve ties by itself. Suppose two events for an account have the same timestamp: ordering only by time leaves the chosen latest row ambiguous. Add a unique event identifier or another business-defined tie-breaker, then filter the row number in QUALIFY. For cumulative windows, explicitly specify the intended frame; RANGE may group peers with equal ordering values, while ROWS advances row by row. A portability test can express the same logic as a subquery with an outer WHERE when another engine lacks QUALIFY. Verify a single-row partition, tied timestamps, null ordering, and the frame boundary against expected business results. Determinism comes from complete ordering, not from the query happening to return the same row in one run.",
