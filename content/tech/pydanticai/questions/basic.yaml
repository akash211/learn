- id: pai-basic-001
  topic: agent basics
  difficulty: beginner
  question: What is a PydanticAI `Agent`?
  answer: 'An `Agent` is a reusable definition of an LLM workflow: it can configure
    a model, instructions, dependency type, tools or toolsets, and expected output
    type. Calling `agent.run` executes a run using a prompt and runtime values. The
    agent object is not itself a persistent user conversation, and declaring a typed
    output does not guarantee factual correctness.


    A useful test covers both the expected path and a rejection or failure path. Replace
    the model with `TestModel` or `FunctionModel` for deterministic orchestration
    checks, and use fake dependencies to inspect actual calls. Then evaluate real
    model behavior separately. This makes it easier to tell a schema defect from a
    prompt, provider, authorization, or transport problem.


    At the boundary, keep the distinction between model-controlled values and application-owned
    state visible. Validate external data before use, derive identity and permissions
    from trusted application context, and make failures explicit rather than silently
    substituting an empty or plausible value. Types improve communication between
    components; they do not replace runtime checks or business policy.'
  tags:
  - agent-basics
  - agent-setup-and-run-lifecycle
- id: pai-basic-002
  topic: agent basics
  difficulty: beginner
  question: What do the dependency and output generic types on `Agent` represent?
  answer: '`Agent[DepsT, OutputT]` describes the application-provided dependency object
    and the value the run should produce. `deps_type` declares the dependency type,
    while `output_type` describes the result contract. A static checker can follow
    these types through context and calls. Types improve clarity, but Python annotations
    do not validate every arbitrary object automatically.


