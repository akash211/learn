  question: What is `RunContext` used for?
  answer: '`RunContext[DepsT]` gives a tool or dynamic agent function access to the
    current run’s dependency object and relevant run context. It is commonly the first
    parameter of a context-aware tool and is injected by the framework rather than
    supplied by the model. Typing it with the declared dependency type helps static
    checking.


