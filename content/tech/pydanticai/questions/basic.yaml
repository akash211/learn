- id: pai-basic-014
  topic: dependencies
  difficulty: intermediate
  question: Should per-user state be stored on a global agent?
  answer: 'Generally no. A global agent definition can be reused, but mutable per-user
    data, credentials or conversation state should not be stored on it. Pass each
    run its own authorized dependencies and history. This avoids cross-request leakage
    and makes concurrency, testing and resource ownership easier to reason about.


