- id: pai-basic-007
  topic: type contracts
  difficulty: beginner
  question: What is the difference between tool arguments and an agent output?
  answer: 'Tool arguments describe a proposed function call the model can make during
    a run; they are validated before the function executes. The output type describes
    the final value returned to the caller when the run completes. Tool calls may
    repeat and return information to the model, while the final output is the application-facing
    result. Both boundaries deserve explicit schemas.


