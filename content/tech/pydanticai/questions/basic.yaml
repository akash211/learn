- id: pai-basic-003
  topic: agent basics
  difficulty: beginner
  question: How do `run`, `run_sync`, and `run_stream` differ?
  answer: '`run` is the async way to complete an agent interaction and returns a result
    wrapper. `run_sync` provides a synchronous entry point for synchronous programs;
    do not invoke it from an already running event loop. `run_stream` gives a streaming
    lifecycle for consuming generated content before completion. They differ in execution
    and result handling, not just spelling.


