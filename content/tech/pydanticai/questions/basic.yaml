- id: pai-basic-013
  topic: dependencies
  difficulty: intermediate
  question: How should dependencies be passed to an agent run?
  answer: 'Declare the dependency type when defining the agent, construct the appropriate
    service or bundle in application code, then pass its instance to `agent.run(...,
    deps=instance)`. This separates trusted services and request scope from model-controlled
    prompt and tool arguments. The application remains responsible for creating, scoping
    and closing resources.


