  difficulty: beginner
  question: What is the difference between `result` and `result.output`?
  answer: 'The run result is a wrapper that can expose the final output along with
    usage, messages and other run metadata. `result.output` is the application value
    described by the agent’s output type, such as a Pydantic model or string. Callers
    should map that value to their own domain or HTTP response instead of serializing
    internal run details blindly.


