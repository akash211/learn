- id: pai-basic-005
  topic: type contracts
  difficulty: beginner
  question: Why is a Pydantic model useful as `output_type`?
  answer: 'A Pydantic model gives a structured result with named fields, constraints
    and optional validators. PydanticAI can use its schema when requesting output
    and validate the returned value before application code receives it. This catches
    structural errors early and gives downstream code a clearer interface than prompt-only
    JSON parsing. It does not establish that the model’s claims are true.


