- id: pai-basic-018
  topic: providers
  difficulty: intermediate
  question: What should a model fallback policy consider?
  answer: 'A fallback may improve availability for certain provider failures, but
    switching models can change privacy, cost, latency, quality and supported features.
    It can also repeat an agent workflow that performed side effects. Define which
    failures are eligible, preserve idempotency, disclose data-route changes where
    needed and test fallback behavior deliberately.


