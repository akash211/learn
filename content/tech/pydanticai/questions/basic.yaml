- id: pai-basic-019
  topic: streaming
  difficulty: intermediate
  question: What does streaming change for an agent caller?
  answer: 'Streaming lets the caller consume output or run events before an agent
    run has fully completed. It can lower perceived latency, but introduces resource-lifetime,
    cancellation and error-midstream concerns. Chunks are not guaranteed to align
    with words or semantic units. The final result and run completion still need explicit
    handling.


