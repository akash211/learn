  topic: testing
  difficulty: intermediate
  question: Why disable non-test model requests in a test suite?
  answer: 'A setting such as `ALLOW_MODEL_REQUESTS=False` can fail fast if a test
    accidentally attempts to use a real provider. That prevents surprise network access,
    cost, latency and nondeterministic results in unit tests. Keep a separately controlled
    integration or evaluation suite for real-provider behavior when appropriate.


