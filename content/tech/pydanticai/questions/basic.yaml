  question: What is `TestModel` used for?
  answer: '`TestModel` is a deterministic test substitute that can drive an agent’s
    basic model interactions without making a request to a live provider. It is useful
    for exercising tools, dependencies and output plumbing. Its output is synthetic;
    a passing test does not show that a real model will follow instructions or produce
    high-quality answers.


