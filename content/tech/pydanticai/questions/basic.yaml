  difficulty: beginner
  question: How do type hints and docstrings affect a function tool?
  answer: 'Type hints help PydanticAI describe and validate the tool’s argument schema,
    while the function name and docstring explain its purpose to the model. These
    descriptions guide tool choice; they are not authorization enforcement. Precise,
    narrow parameters are usually easier to validate and understand than a generic
    unstructured dictionary.


