- id: pai-basic-006
  topic: type contracts
  difficulty: beginner
  question: Does a validated agent output prove that an answer is correct?
  answer: 'No. Validation proves the value met the declared structural and local constraints,
    such as required fields or a numeric range. A model can still choose the wrong
    category, invent a source, or misunderstand the question while producing a perfectly
    valid object. Factual grounding, authorization, business rules and answer quality
    need separate checks and evaluations.


