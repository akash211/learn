  difficulty: beginner
  question: Are valid tool arguments automatically safe to execute?
  answer: 'No. Validation checks whether arguments match a schema; it does not prove
    the caller has permission, that an operation is sensible, or that the target resource
    belongs to the user. The tool implementation must apply authentication-derived
