- id: pai-basic-009
  topic: tools
  difficulty: beginner
  question: When should `@agent.tool_plain` be used?
  answer: 'Use `@agent.tool_plain` for a tool function that does not need run context
    or injected dependencies. It can still receive typed model arguments and return
    a value. Use `@agent.tool` when the operation needs trusted context such as a
    scoped service. Choosing between them makes dependencies visible rather than relying
    on global variables.


