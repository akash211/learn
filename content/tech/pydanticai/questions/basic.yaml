  topic: testing
  difficulty: intermediate
  question: What does `Agent.override` enable in tests?
  answer: '`Agent.override(...)` can temporarily replace the model or dependencies
    used by an agent, allowing application functions to run with test doubles without
    redesigning production call signatures. Scope overrides around a test and avoid
    concurrent mutable state leakage. Verify exact override parameters and concurrency
    behavior against the installed version.


