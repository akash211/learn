- id: pai-basic-008
  topic: tools
  difficulty: beginner
  question: What does `@agent.tool` do?
  answer: '`@agent.tool` registers a callable that the model may request during an
    agent run. The first function parameter is normally `RunContext[DepsT]`, which
    PydanticAI supplies; remaining typed parameters describe model-provided arguments.
    The runtime validates those arguments before calling the Python function. Registration
    alone does not authorize a requested operation or guarantee the model will choose
    it.


