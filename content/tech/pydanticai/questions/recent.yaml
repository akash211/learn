- id: pai-recent-004
  topic: MCP security
  difficulty: advanced
  question: What security review is needed before connecting a remote MCP server?
  answer: 'Treat server identity, transport, tool descriptions, schemas and returned
    content as untrusted until reviewed. Authenticate remote connections, restrict
    available tools, authorize every action in application code, limit returned data
    and use timeouts. A tool schema documents a call shape; it does not prove the
    server or operation is safe.


