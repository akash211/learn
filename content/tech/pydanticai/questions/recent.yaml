- id: pai-recent-005
  topic: testing
  difficulty: advanced
  question: How should `TestModel` tests be complemented?
  answer: 'Use deterministic model doubles for the application’s mechanics, then separately
    evaluate real-model behavior with representative and adversarial cases. The two
    answer different questions: unit tests check your code under known interactions;
    evaluations measure whether an actual model handles task examples acceptably.
    Record model and prompt versions to interpret changes.


