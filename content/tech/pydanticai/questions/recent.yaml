- id: pai-recent-006
  topic: streaming
  difficulty: advanced
  question: What should a service do when a streamed agent run fails after output
    begins?
  answer: 'Once HTTP response headers or body chunks are sent, the server usually
    cannot replace the response with a new status and ordinary error body. Define
    a stream-level error/completion event or buffer until the necessary checks finish.
    Propagate disconnects, close upstream resources and make truncation distinguishable
    from successful completion.


