  topic: MCP
  difficulty: advanced
  question: How does an `MCPToolset` connect an agent to MCP tools?
  answer: 'An `MCPToolset` can expose tools from an MCP server to a PydanticAI agent
    as a toolset. It can use supported local or remote transports depending on configuration.
    The connected server is an external authority boundary: review tools, credentials,
    transport security and lifecycle, and do not expose every remote capability indiscriminately.


