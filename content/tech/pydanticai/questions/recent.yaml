- id: pai-recent-001
  topic: current APIs
  difficulty: advanced
  question: How should a team handle PydanticAI API changes across releases?
  answer: 'Treat current documentation as authoritative for a pinned version, and
    avoid copying a snippet from an old example without checking imports, parameter
    names and lifecycle details. PydanticAI evolves quickly, so lock compatible dependencies,
    read migration notes and keep a small suite around critical agent paths.


    A useful test covers both the expected path and a rejection or failure path. Replace
    the model with `TestModel` or `FunctionModel` for deterministic orchestration
    checks, and use fake dependencies to inspect actual calls. Then evaluate real
    model behavior separately. This makes it easier to tell a schema defect from a
    prompt, provider, authorization, or transport problem.


    At the boundary, keep the distinction between model-controlled values and application-owned
    state visible. Validate external data before use, derive identity and permissions
    from trusted application context, and make failures explicit rather than silently
    substituting an empty or plausible value. Types improve communication between
    components; they do not replace runtime checks or business policy.'
  tags:
  - current-APIs
  - version-pinning-and-API-drift
  period: 2024-2026
  type: representative
- id: pai-recent-002
  topic: structured output
  difficulty: advanced
  question: What should be checked when relying on provider-native structured output?
  answer: 'Verify that the selected provider and model actually support the output
    mode and schema features the application uses. A shared agent API does not make
    vendor behavior identical. Test unions, constraints, refusals and malformed responses
    using the exact integration configuration, and provide a controlled error path
    if capability is unavailable.


