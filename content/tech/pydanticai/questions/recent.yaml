- id: pai-recent-008
  topic: FastAPI
  difficulty: advanced
  question: Why avoid holding a database transaction open while an agent waits for
    a model?
  answer: 'Model requests can be slow or retry, and an open transaction may hold locks
    or consume scarce connections throughout that wait. Fetch and authorize the necessary
    data, commit or close the unit of work, then call the model with the minimum needed
    context when the business flow permits. Recheck mutable state before a later write.


