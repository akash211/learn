  question: How should FastAPI dependencies and PydanticAI run dependencies fit together?
  answer: 'FastAPI should authenticate the request and construct appropriately scoped
    services; the endpoint passes those services to the agent run as its dependency
    object. Keep the HTTP dependency graph and agent `RunContext` distinct but composable.
    Test tenant isolation and resource closure rather than assuming either framework
    supplies the other’s lifecycle.


