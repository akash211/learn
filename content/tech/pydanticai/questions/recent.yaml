- id: pai-recent-009
  topic: retries
  difficulty: advanced
  question: How should retries be bounded for validation failures and provider failures?
  answer: 'Decide which failures are recoverable, set explicit attempt and time limits,
    and distinguish malformed model output from provider outage or a rejected business
    action. Retrying costs time and tokens and may repeat side effects. Surface an
    explicit failure state when the budget is exhausted; do not weaken authorization
    to force success.


