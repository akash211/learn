  tags: [collections, dependencies]

- id: ans-basic-021
  topic: connection versus delegation
  difficulty: intermediate
  question: What does `delegate_to` change about task execution?
  answer: |
    `delegate_to` runs a task on a different host than the current inventory host, often `localhost` for a controller-side API call or a load balancer host for a local operation. The original inventory host context still matters for variables such as `inventory_hostname`, while connection and credential requirements apply to the delegated execution location. This can change which machine needs network access and which credentials must be available. Delegation does not automatically make a task idempotent or safe to retry. When combined with `run_once`, serial batches or a non-default strategy, verify how often it executes. Model API operations as desired state when possible and test failure handling.
    Test the behavior against the project's pinned `ansible-core` and collection versions, using a disposable host where possible; then record any platform assumptions in the role or runbook.
  tags: [delegation, execution]

- id: ans-basic-022
  topic: performance
  difficulty: intermediate
  question: How do forks affect Ansible performance and risk?
  answer: |
    The `forks` setting limits how many worker processes Ansible uses for concurrent host work. A higher value can improve throughput when many hosts are independent, the controller has capacity and the network and targets can handle more simultaneous connections. It can also increase controller memory use, SSH sessions, API requests, package-manager contention and load on fragile hosts. More forks therefore do not guarantee a faster or safer run. Measure task timing and test representative concurrency before changing the setting. Use `serial` when the goal is to limit rollout batch size rather than simply alter global concurrency. Preserve an operational stop condition if early hosts fail.
    Test the behavior against the project's pinned `ansible-core` and collection versions, using a disposable host where possible; then record any platform assumptions in the role or runbook.
  tags: [forks, performance]

- id: ans-basic-023
  topic: serial rollouts
  difficulty: intermediate
  question: What is the purpose of the `serial` play keyword?
  answer: |
    `serial` divides the hosts in a play into batches, so Ansible completes the play for one batch before moving to the next. It supports rolling maintenance or deployment where changing every service instance at once would reduce availability. A value such as `serial: 2` processes two hosts per batch; a list can stage batch sizes. Choose batch size according to redundancy, traffic and recovery capability, and combine it with health checks and a failure policy when later batches should stop. `serial` is not a rollback mechanism and does not itself prove the first batch is healthy. Test handler timing and any `run_once` tasks with the chosen batch configuration.
    Test the behavior against the project's pinned `ansible-core` and collection versions, using a disposable host where possible; then record any platform assumptions in the role or runbook.
  tags: [serial, rollout]

- id: ans-basic-024
  topic: tool choice
  difficulty: intermediate
  question: When would you choose Ansible, Terraform, or an immutable-image approach?
  answer: |
    Ansible is a natural fit for configuring existing hosts, packages, files and services, and for coordinating operational workflows over SSH or supported APIs. Terraform is usually better suited to provisioning and managing cloud resources such as networks, instances, disks and managed services through provider APIs, with an explicit plan and state model. A clean division is often Terraform for infrastructure lifecycle and Ansible for operating-system configuration, with one owner for each property. An immutable-image approach may be simpler when hosts can be replaced from tested images and ongoing mutation is unnecessary. That shifts effort toward image build, rollout and observability. Choose according to lifecycle and recovery needs, not a universal ranking.
    Test the behavior against the project's pinned `ansible-core` and collection versions, using a disposable host where possible; then record any platform assumptions in the role or runbook.
  tags: [terraform, images, tools]
