- id: ans-basic-001
  topic: inventory
  difficulty: beginner
  question: What does an Ansible inventory contain, and how do groups help?
  answer: |
    An inventory identifies managed hosts and organizes them into groups. It may be a static INI or YAML file, a directory of sources, or a dynamic inventory plugin that queries a cloud API or CMDB. Groups let a play target a role or environment such as `web` or `staging` rather than embedding individual machines in the playbook. A host can belong to more than one group, and group and host variables can supply connection and application configuration. Inspect the parsed result with `ansible-inventory -i inventory.yml --graph` or `--list`; do not assume the file's visual layout is exactly the merged inventory. Keep production boundaries explicit and do not commit passwords or private keys as ordinary inventory data.
    Test the behavior against the project's pinned `ansible-core` and collection versions, using a disposable host where possible; then record any platform assumptions in the role or runbook.
  tags: [inventory, groups]

- id: ans-basic-002
  topic: host patterns
  difficulty: beginner
  question: How would you confirm the hosts a playbook pattern and limit will select?
  answer: |
    Run `ansible-playbook -i inventory/prod.yml site.yml --list-hosts` with the same `--limit` value you plan to use for execution. Ansible host patterns can refer to groups and individual inventory names and can combine inclusion, intersections and exclusions. For example, `web:&canary:!drained` means web hosts that are also in the canary group but not in drained. Quote patterns with punctuation so YAML or the shell does not reinterpret them. Remember that `--limit` narrows the play's `hosts:` pattern; it does not add hosts that the play did not target. Treat an empty or unexpectedly broad list as a failed precondition, especially when dynamic inventory membership can change between review and execution.
    Test the behavior against the project's pinned `ansible-core` and collection versions, using a disposable host where possible; then record any platform assumptions in the role or runbook.
  tags: [patterns, targeting]

- id: ans-basic-003
  topic: connections
  difficulty: beginner
  question: Which connection variables commonly configure Ansible SSH access?
  answer: |
    Common host variables include `ansible_host` for the destination address, `ansible_user` for the SSH login identity, `ansible_port`, and `ansible_ssh_private_key_file` for the key path on the controller. Connection plugin behavior can also be configured in `ansible.cfg`. The inventory alias remains the name used in patterns and output even when `ansible_host` points elsewhere. SSH login and privilege escalation are separate: `become: true` elevates selected tasks after connecting and does not change the SSH account. Use host-key verification and a managed key distribution process rather than disabling verification to avoid errors. Store secrets outside ordinary committed inventory, and check that the executing controller has the expected private key and network path.
