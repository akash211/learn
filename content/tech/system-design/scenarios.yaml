- id: sd-scn-001
  title: Design multi-tenant event ingestion for 140 GB a day
  technologies: [python, kafka, sql]
  difficulty: advanced
  prompt: |
    A B2B analytics product has 400 tenant customers. Each tenant's web and mobile SDKs send
    product events to a single endpoint. Current volume is 3.5 million daily active users at
    40 events each, 1 KB per event — 140 GB/day, peaking at 3× average. The largest tenant is 30%
    of traffic and has a contractual right to "no data loss".

    Requirements: events queryable within 60 seconds for the live dashboard, 13 months of history
    for reports, per-tenant isolation so one customer cannot degrade another, and a per-tenant
    quota that returns 429 rather than accepting data the platform cannot process. The team is four
    engineers who already run Postgres and Kafka.

    Walk through requirements, the envelope, the ingest path, storage layout, and what happens when
    a tenant sends 10× its normal volume.
  approach: |
    **Rubric — 5 bands, 2 points each (10 total).**

    **1. Requirements and envelope (0–2).** Computes 1,620 events/s average and 4,860/s peak,
    140 GB/day, 51.1 TB/year raw or ~12.8 TB/year as 4× Parquet. States the latency and durability
    contract, and notices that "no data loss" for one tenant implies stronger handling than the
    default. 2 points for correct arithmetic with named assumptions; 1 for the right method with
    one arithmetic slip; 0 for "Kafka scales horizontally" with no numbers.

    **2. Ingest and isolation (0–2).** Proposes an authenticated edge that resolves tenant, applies
    a token-bucket quota, and writes to a partitioned log keyed by `tenant_id` (or
    `tenant_id:user_id`). Explains that partitioning by tenant keeps per-tenant order and makes
    isolation enforceable, and that the largest tenant at 30% of 4,860/s = 1,458/s must not share a
    partition with 399 small tenants. Mentions backpressure (429 with `Retry-After`) and a buffer.

    **3. Storage and query path (0–2).** Raw immutable landing plus Parquet in a lake, partitioned
    by `event_date` and clustered by `tenant_id`; a warehouse or query layer for 13-month reports;
    a streaming aggregate for the 60-second dashboard. Recognises that 13 months × 12.8 TB/year ≈
    13.9 TB is affordable but full raw retention is not.

    **4. Failure and operations (0–2).** At-least-once delivery with idempotent writes keyed by
    `event_id`; consumer lag alarms in seconds; a dead-letter path for malformed events; replay for
    a bad deploy. Handles the no-data-loss tenant with synchronous acknowledgement from the log
    (acks=all, min.insync.replicas=2) and states the latency cost.

    **5. Trade-offs and honesty (0–2).** Names what is given up — for example per-tenant ordering
    versus even partition distribution, or 60-second freshness versus batch cost — and gives a
    build order: single Postgres plus log first, lake second, per-tenant shard only when a tenant
    exceeds one partition's capacity.

    **Automatic fail:** no quota enforcement; a design where one tenant's traffic shares a single
    global partition key; claiming exactly-once without idempotency.
  red_flags:
    - Accepting unbounded writes and calling the queue the buffer.
    - Partitioning by event_id, which destroys per-user and per-tenant ordering.
    - No answer for a tenant that grows 10× overnight beyond adding more brokers.
    - Quoting storage without compression or replication.

- id: sd-scn-002
  title: Backfill 500 GB of sessions in a four-hour window
  technologies: [python, sql, airflow]
  difficulty: advanced
  prompt: |
    A sessions table needs rebuilding for the last 180 days: 500 GB of Parquet, 3.15 billion rows
    at roughly 159 bytes each. The previous attempt was a single Spark job that timed out at 90
    minutes and left the table half-loaded with no record of progress. Dashboards read this table
    every morning at 06:00, and the window is 02:00–06:00.

    The source is a 300 TB lake of raw events at 140 GB/day. The cluster has 8 workers, each
    sustaining about 8 MB/s of Parquet write on this data. Downstream, six models and four
    dashboards read the table directly.

    Design the backfill: unit of work, write strategy, progress tracking, validation, and the
    rollback plan if the output is wrong at 05:30.
  approach: |
    **Rubric — 5 bands, 2 points each (10 total).**

    **1. Arithmetic (0–2).** Checks the row size (500 GB ÷ 3.15B = 159 B) and derives duration from
    throughput: 8 workers × 8 MB/s = 64 MB/s, 500,000 MB ÷ 64 MB/s = 7,812 s ≈ 2.2 h, plus 30% for
    skew ≈ 2.8 h. Concludes it fits with margin. 2 points for the full chain; 1 for a plausible
    duration with no per-worker basis; 0 for "should be fast enough".

    **2. Unit of work and idempotency (0–2).** One task per day (180 tasks), each writing a single
    partition, retryable in isolation. Partition overwrite (Iceberg/Delta dynamic overwrite) so a
    re-run of day 47 cannot duplicate or delete day 48. Names the failure mode of an unscoped
    `INSERT INTO … SELECT`.

    **3. Write target and isolation (0–2).** Writes to a shadow table or shadow partitions, not the
    live table, so 06:00 readers see either the old complete data or the new complete data. Caps
    concurrency or uses a separate cluster to protect the live dashboards. Validates before the
    swap: row count per day within 0.1%, unique `session_id`, required columns non-null, checksum
    on a 1% sample.

    **4. Progress and recovery (0–2).** A control table `(dataset, partition, status, rows, bytes,
    started_at, finished_at, error)` written per task, with resume skipping completed partitions
    and a queryable progress percentage. Explains why a restart at 90 minutes is cheap rather than
    a full redo.

    **5. Rollback and communication (0–2).** Keeps the previous snapshot (or writes to a new table
    and swaps the view) so a wrong output at 05:30 can be reverted in minutes. Publishes the
    extrapolated completion time after three partitions, and defines the abort condition — for
    example, if projected finish is after 05:15, stop and leave the old table in place.

    **Automatic fail:** loading directly into the live table; no progress table; a single
    monolithic job; claiming completion without measuring the first partitions.
  red_flags:
    - Replying that a bigger cluster will fix it, with no throughput estimate.
    - No shadow table or snapshot, so a bad run destroys the morning reports.
    - Retrying by restarting from day one.
    - Ignoring late-arriving events in the final partition.

- id: sd-scn-003
  title: Design a real-time fraud scoring pipeline
  technologies: [python, kafka, sql]
  difficulty: advanced
  prompt: |
    A payments company wants to score every card transaction for fraud before authorisation. Volume
    is 4,000 transactions/s at peak, 1.2 KB per event, and the decision must return within 100 ms
    p99 — the authorisation window. Roughly 0.3% of transactions are fraudulent, and the current
    batch model runs hourly, so fraud is discovered after the money has moved.

    Features must include per-card velocity (transactions in the last 1, 5 and 60 minutes), a
    per-merchant risk score refreshed daily, and a device fingerprint lookup. Historical data is
    180 days of transactions, about 40 billion rows.

    Design the pipeline end to end, including the feature store, the model serving path, and what
    happens when a feature is missing at decision time.
  approach: |
    **Rubric — 5 bands, 2 points each (10 total).**

    **1. Envelope and latency budget (0–2).** Computes 4,000/s × 1.2 KB = 4.8 MB/s, 400 GB/day raw.
    Allocates the 100 ms explicitly: 15 ms feature lookups, 5 ms model inference, 10 ms network and
    serialisation, leaving headroom for p99 rather than average. Recognises that a synchronous
    100 ms budget forbids a database query per feature.

    **2. Feature computation (0–2).** Distinguishes precomputed from on-demand. Velocity windows
    over 1, 5 and 60 minutes are maintained in a stateful streaming job keyed by `card_id` and
    written to a low-latency store (Redis or an embedded KV); the decision path reads them with a
    single multi-get. Merchant risk is a daily batch table. Names the state size: active cards in a
    60-minute window, not all cards.

    **3. Serving path and failure (0–2).** A synchronous scoring service with a hard timeout
    (say 40 ms), a cached default for missing features, and an explicit policy for cold start — a
    new card has no velocity, so fall back to a model variant or a conservative rule. Explains that
    failing open approves fraud and failing closed declines good customers; the business chooses,
    and the choice is logged.

    **4. Correctness and training-serving skew (0–2).** The same feature definitions must produce
    training and serving values; otherwise the model is trained on data it will never see. Mentions
    point-in-time joins for the 180-day history, and that a feature computed at decision time must
    be reproducible later for retraining.

    **5. Operations (0–2).** Monitors decision latency p99, feature-store hit rate, score
    distribution drift, and the approval rate by merchant. Shadow mode before enforcement. A
    replay path for the 180 days of history, at 40 billion rows, sized honestly rather than
    promised.

    **Automatic fail:** a per-feature database call inside the 100 ms budget; no cold-start policy;
    claiming the streaming job and the batch training set compute the same features without
    point-in-time correctness.
  red_flags:
    - Computing velocity with a query per transaction.
    - No fallback when Redis is unavailable.
    - Training on features that cannot be computed at decision time.
    - Ignoring p99 and budgeting for the average.

- id: sd-scn-004
  title: Design a documentation assistant at 200,000 requests a day
  technologies: [python]
  difficulty: advanced
  prompt: |
    An internal documentation assistant answers questions over 2 million chunks of engineering
    docs. Traffic is 200,000 requests/day, peaking at 10 requests/s. Answers must cite the passages
    they used, time-to-first-token should be under 1 second, and the full answer under 8 seconds.
    The monthly budget is $45,000, and the current prototype costs about $63,000 at $0.0105 per
    request with 1,500 input and 400 output tokens.

    Product wants an answer for every question. Legal wants no internal document text retained by
    the model provider, and engineering wants a way to know whether a prompt change made things
    worse.

    Design the service, the retrieval path, the cost model, and the evaluation strategy.
  approach: |
    **Rubric — 5 bands, 2 points each (10 total).**

    **1. Cost arithmetic (0–2).** Reproduces the per-request cost: 1,500 × $3/M + 400 × $15/M =
    $0.0105; 200,000/day = $2,100/day = $63,000/month. Proposes levers with numbers: prompt
    caching 1,200 tokens at 90% off saves $648/day, a 20% response-cache hit saves about
    $8,700/month, landing near $34,800. 2 points for a defensible path under budget; 1 for a
    cheaper model with no arithmetic.

    **2. Retrieval (0–2).** Hybrid BM25 plus vectors, top 20 candidates, rerank to 5. Sizes the
    index: 2M × 1,536 × 4 B = 12.3 GB, ~18.4 GB with HNSW. Explains that retrieval quality caps
    answer quality and that recall@5 is the metric to watch.

    **3. Latency (0–2).** Builds a budget: guardrails 20 ms, retrieval 120 ms, rerank 80 ms, queue
    40 ms, prefill 500 ms → TTFT 760 ms; 400 output tokens at 60 tok/s = 6.7 s → 7.4 s total.
    Concludes streaming is required and that an output cap is the latency control.

    **4. Grounding, safety and failure (0–2).** Citations validated against retrieved ids; refusal
    when retrieval confidence is low rather than guessing; retrieved text treated as data, never
    instructions; PII redaction; provider timeout, retry with jitter, circuit breaker, and a
    degraded sources-only mode. Addresses the no-retention requirement with a zero-retention
    endpoint or a self-hosted model.

    **5. Evaluation and iteration (0–2).** A 300-item golden set with required facts and expected
    passages; retrieval recall@5, answer correctness, citation validity, refusal correctness; a
    regression gate of 2 points; 1% production sampling for human review. Versioned prompts.

    **Automatic fail:** no evaluation set; reaching for a bigger model as the only lever; caching
    answers without an invalidation story; claiming zero hallucination.
  red_flags:
    - Trimming the prompt by removing citations to save cost.
    - No fallback when the provider is down.
    - Tuning prompts by anecdote.
    - Ignoring the difference between prefill and generation throughput.

- id: sd-scn-005
  title: Design inventory reservation across three regions
  technologies: [sql, python]
  difficulty: advanced
  prompt: |
    A retailer sells 40,000 SKUs from three regional warehouses. Checkout must reserve stock
    atomically: two customers cannot buy the last unit. Peak is 1,200 reservations/s globally,
    with 300 ms p95 to confirm. Inventory is currently a single Postgres primary in one region,
    and the company wants active-active in three regions for latency and disaster recovery.

    Returns and cancellations release reservations; a reservation expires after 10 minutes if
    payment does not complete. There are 40 million reservation attempts per day.

    Design the consistency model, the data model, and the cross-region strategy. Be explicit about
    what you would *not* make active-active.
  approach: |
    **Rubric — 5 bands, 2 points each (10 total).**

    **1. Consistency reasoning (0–2).** States that the invariant is per-SKU:
    `available = on_hand − reserved` must never go negative. Argues that this needs a conditional
    write (`UPDATE … SET reserved = reserved + 1 WHERE available >= 1`) or a serializable
    transaction, not read-then-write. Recognises that active-active multi-region writes on the same
    SKU turn a local invariant into a distributed one, with coordination cost on every checkout.

    **2. Data model and reservation lifecycle (0–2).** `inventory(sku, warehouse, on_hand, reserved,
    version)` plus `reservations(id, sku, qty, state, expires_at)`. State machine:
    held → confirmed → released/expired, with idempotent transitions. Expiry as a scheduled sweep
    rather than a per-row timer, and the arithmetic: 40M attempts/day at a 10-minute TTL implies a
    working set of roughly the attempts in ten minutes, not the full day.

    **3. Partitioning and hot SKUs (0–2).** Shards by SKU, since every reservation touches one SKU.
    Notes that a flash-sale SKU becomes a single-row hot key at 1,200/s and that the fix is
    bucketing stock into N sub-rows summed on read, or queueing per SKU. 40,000 SKUs across a few
    shards is small; the constraint is contention, not volume.

    **4. Cross-region strategy (0–2).** Recommends a single writer per SKU (home region) with
    synchronous replication for durability and a fast failover, plus regional read replicas for
    browse traffic. Or partitions inventory by region so each region owns its stock and checkout
    routes to the owning region. Explicitly refuses active-active writes for the same SKU, and
    says why: the coordination cost lands inside the 300 ms budget.

    **5. Failure and reconciliation (0–2).** What happens on region loss — RPO/RTO stated, in-flight
    reservations resolved by expiry, double-sell detection via a reconciliation query. Idempotency
    key on reservation creation, so a client retry does not hold two units. Handles payment failure
    releasing stock, and the 10-minute expiry against a slow payment provider.

    **Automatic fail:** read-then-write without a conditional update; active-active writes on the
    same SKU with no coordination story; no expiry mechanism; no idempotency on reservation
    creation.
  red_flags:
    - Proposing CRDTs without explaining how they preserve a stock invariant.
    - Checking availability in the application and updating later.
    - Ignoring the flash-sale hot key.
    - Making every region writable because multi-region sounds more available.

- id: sd-scn-006
  title: The dashboard is 40 minutes stale and finance has noticed
  technologies: [airflow, sql, python]
  difficulty: intermediate
  prompt: |
    An executive revenue dashboard reads from a warehouse table refreshed by an hourly Airflow DAG.
    The DAG extracts 140 GB of events, joins a 1.1 TB CDC feed, rebuilds three aggregates, and
    writes 500 GB of Parquet. It used to finish in 25 minutes; now it takes 95 and sometimes spills
    past the next scheduled run, so two runs overlap. This morning the dashboard showed yesterday's
    numbers at 09:00 and finance escalated.

    The cluster has not changed. Event volume grew 40% over six months. There is no backfill
    problem — the data eventually lands — but the freshness SLA of 60 minutes is being missed two
    or three times a week.

    Diagnose the cause and propose a design that restores the SLA with a defensible cost.
  approach: |
    **Rubric — 5 bands, 2 points each (10 total).**

    **1. Quantify the regression (0–2).** Turns "40% growth" into time: if 25 minutes became 95,
    the growth alone (1.4×) does not explain 3.8×, so something else changed — file count, shuffle
    partition size, or a join that no longer broadcasts. Asks for stage-level timings rather than
    guessing. 2 points for separating volume growth from structural regression.

    **2. Locate the cost (0–2).** Names the likely culprits: small files from incremental appends
    (a 40% volume increase can double file count if the writer flushes per batch), a shuffle that
    exceeds memory and spills, a broadcast join that flipped to sort-merge, or stale statistics
    after a CDC schema change. Proposes reading the Spark UI stage timings and the warehouse query
    profile before changing anything.

    **3. Structural fix (0–2).** Moves from full rebuild to incremental: process only the new
    hourly partition, merge into the target, and compact small files on a separate schedule.
    Partition by hour so a run reads 5.8 GB rather than 140 GB. Keeps the 500 GB aggregate as an
    incremental upsert rather than a full rewrite, or materialises it from the silver layer with
    partition pruning.

    **4. Scheduling and overlap (0–2).** Notices that overlapping runs compound the problem: two
    concurrent jobs compete for the same workers and both slow down. Adds `max_active_runs=1`, a
    sensible catch-up policy, and an SLA miss alert at 45 minutes — before the 60-minute deadline,
    not after. Considers a separate pool for the critical DAG.

    **5. Cost and verification (0–2).** Compares the incremental design's cost with the current
    one: reading 5.8 GB/hour instead of 140 GB, at the cost of compaction and merge overhead.
    Proposes measuring p50/p95 duration over a week, and a canary partition before the full
    rollout. States the residual risk — late-arriving CDC records needing a lookback window.

    **Automatic fail:** adding workers as the only answer; no measurement of where time goes;
    removing the SLA alert to stop the pages.
  red_flags:
    - Scaling the cluster before reading stage timings.
    - Full rebuilds for an hourly refresh at 140 GB/day.
    - Allowing overlapping runs and treating the overlap as harmless.
    - No lookback for late-arriving CDC data.

- id: sd-scn-007
  title: Design multi-tenant analytics with row-level isolation for 1,500 tenants
  technologies: [python, sql, spark]
  difficulty: advanced
  prompt: |
    A B2B product analytics company runs 1,500 tenant accounts. Tenants send 250 million events a
    day at about 800 bytes each, peaking at 4x average. Each tenant sees only its own data: a
    dashboard that must return in under 2 s p95, and a report builder whose scans can span 13
    months. The largest tenant is 18% of all events. Contracts promise deletion of a tenant's data
    within 30 days of termination, and finance wants per-tenant infrastructure cost. The team is
    six engineers running Postgres, object storage and a Spark cluster.

    Walk through the isolation model, the storage layout, the query path, and what happens when one
    tenant runs a 13-month scan at 09:00 on a Monday.
  approach: |
    **Rubric — 5 bands, 2 points each (10 total).**

    **1. Envelope arithmetic (0–2).** 250M ÷ 86,400 = 2,894 events/s average; at 4x that is
    11,574/s peak, and peak sizes the ingest path. Storage: 250M × 800 B = 200 GB/day, x 365 = 73
    TB/year raw; Parquet with zstd at roughly 5x on flat JSON with repeated event names gives 14.6
    TB/year, so 13 months is 15.8 TB. Rows: 250M x 395 = 98.75 billion. The largest tenant at 18%
    is 45M events/day = 521/s average and 2,084/s peak, and owns 2.8 TB of the 15.8; the average
    tenant is 15.8 TB ÷ 1,500 = 10.5 GB. That last number is the design driver: 1,480 of 1,500
    tenants are small enough to share one pool. Query load is 40,000 dashboard queries/day, 70% of
    them in a nine-hour window: 28,000 ÷ 32,400 s = 0.86/s, and about 4.3/s at a 5x peak. Even the
    burst is tiny, which is the point — this is a low-concurrency, high-scan workload, so the
    binding constraint is bytes scanned per query, not queries per second. A candidate who sizes
    the query tier for QPS has misread the problem.

    **2. Isolation model (0–2).** Compares the three placements with the cost named. Shared tables
    with tenant_id keep one copy of 15.8 TB and one schema to migrate; isolation rests entirely on
    the query layer, so a single missing predicate is a cross-tenant leak. Schema or database per
    tenant gives catalog separation but not resource separation, and 1,500 schemas means every
    migration is 1,500 DDL statements against a catalog that was not built for it. Silo per tenant
    is the only option that also isolates storage throughput, and it is unaffordable for 1,500
    tenants. The strong answer is tiered: the 20 tenants above 0.5% of events (55% of volume
    combined) get their own Iceberg namespace and their own query resource group; the remaining
    1,480 share a pool holding 45% of events = 7.1 TB. Enforcement is named explicitly and in three
    layers: the tenant comes from the authenticated session and never from a request parameter; the
    semantic layer compiles a tenant predicate into every model and a CI check rejects any query
    against an event table without it; and engine-level row filters act as defence in depth. Cache
    keys include the tenant — a shared key on a query hash is the classic leak, and it fails
    silently because the numbers returned are plausible.

    **3. Storage and query path (0–2).** Raw events land in Iceberg partitioned by event_date and
    bucketed by a hash of tenant_id into 16 buckets, so one tenant's scan touches 1/16 of a day's
    files rather than all of them. At a 512 MB target file size, 200 GB/day is about 400 files/day,
    or 158,000 files over 13 months for the pool — manageable only because date and bucket pruning
    cut a single-tenant query to a few hundred files. Raw alone is still the wrong path for a 2 s
    dashboard, so two rollups carry the interactive load: tenant_hour_event at tenant x hour x
    event name (1,500 x 8,760 x 40 = 525.6M rows/year at about 120 B, 63 GB/year) and
    tenant_user_day for funnels and retention. One tenant's annual slice of the hourly rollup is
    350k rows, about 42 MB, comfortably inside 2 s. The honest limit is the report builder: a
    13-month scan at raw grain over the largest tenant is 2.8 TB, which at a realistic 2 GB/s scan
    rate is 1,400 s. So reports above a scan threshold (say 200 GB after pruning) are submitted as
    a batch job that materialises a result table and notifies, rather than pretending an
    interactive query planner can do it. State that boundary instead of promising sub-30 s.

    **4. Noisy neighbour and the Monday 09:00 scan (0–2).** The scenario is not a volume problem but
    a contention problem: one query can hold a worker slot and evict everyone else's pages. Controls
    are per-tier resource groups with a memory ceiling (pool tenants capped at 30% of cluster
    memory), per-tenant concurrency of three queries, a per-query scan limit of 200 GB and a 120 s
    runtime cap, and fair-share queueing so a small tenant waits seconds rather than being rejected.
    Ingestion and compaction run on separate compute from queries, and compaction is scheduled
    outside the 08:00-18:00 window, because a compaction job competing with dashboards is
    self-inflicted. Cost attribution falls out of the same instrumentation: bytes scanned per query
    tagged by tenant, which becomes both the chargeback number and the evidence for moving a tenant
    to a silo.

    **5. Deletion, failure modes and grading (0–2).** Deletion is the requirement teams fake. An
    Iceberg delete of rows for one tenant writes delete files and hides the data, but the bytes
    remain, so a rewrite of the affected partitions must follow, and snapshot expiry must be shorter
    than the 30-day promise or time travel resurrects the data. Verification is a scan for the
    tenant returning zero rows plus a manifest check, not a dropped view. Failure modes worth
    naming: duplicate events from an at-least-once ingest (dedupe on event_id during the merge);
    mobile SDKs buffering 48 hours, so rollups rebuild with a three-day lookback; per-tenant custom
    event properties stored as a map column rather than dynamic columns; a tenant over quota getting
    429 at the edge with the payload buffered in the log, not in Postgres.

    **Trade-offs to state.** Bucketing by tenant costs pruning efficiency for internal cross-tenant
    analysis. Rollups cost an hour of freshness and a rebuild path that must be tested. Silos cost
    per-tenant operational surface — 20 namespaces is 20 things to monitor. Build order: one table
    plus row filters plus rollups; split a tenant into its own namespace when its queries exceed 10%
    of cluster memory; a dedicated cluster only when a contract pays for it.

    **Automatic fail:** taking the tenant from a request parameter; caching without the tenant in
    the key; one global queue with no per-tenant limits; claiming deletion while raw files remain.
  red_flags:
    - Row-level security offered as the whole isolation story, with no failure mode named.
    - Sizing the query tier from QPS when the workload is scan-bound.
    - One schema per tenant for 1,500 tenants, with no migration arithmetic.
    - Deleting rows in a view and calling the data gone.

- id: sd-scn-008
  title: Score 5,000 authorisations a second inside a 200 ms p99 window
  technologies: [python, kafka, sql]
  difficulty: advanced
  prompt: |
    A card processor scores every authorisation for fraud inline. Peak is 5,000 events/s, average
    3,000/s, 1.5 KB per event, and the issuer's window closes at 200 ms p99. There are 45 features:
    card velocity over 1, 5 and 60 minutes, a merchant risk score refreshed daily, device-to-account
    graph features, and 180 days of history — 46 billion transactions. About 0.1% of transactions
    are fraudulent, the average ticket is $50, a false decline costs roughly $8 in lost margin and
    support, and chargebacks arrive up to 120 days later. The review team can handle 2,000 cases a
    day.

    Design the pipeline, the feature path, the decision policy, and say what happens when a feature
    or a model is unavailable.
  approach: |
    **Rubric — 5 bands, 2 points each (10 total).**

    **1. Envelope and consistency checks (0–2).** 3,000 × 1.5 KB = 4.5 MB/s average and 5,000 × 1.5
    KB = 7.5 MB/s at peak — small for a log, which is the point: the constraint is latency, not
    bandwidth. Daily volume: 3,000 × 86,400 = 259.2M events × 1.5 KB = 389 GB/day, 142 TB/year raw
    and about 28 TB/year at 5x Parquet compression, so 180 days of history is 14.0 TB. Cross-check
    the prompt against itself: 46B rows ÷ 180 days = 255.6M rows/day, within 1.4% of the 259.2M
    derived from the rate, which means the history and the live feed are the same population. Say
    that out loud, because a candidate who never reconciles the two numbers will size training on a
    different dataset than serving. Partition count: 5,000 ÷ 24 partitions = 208 events/s per
    partition, and a consumer task sustains roughly 1,000/s on this shape, so peak utilisation is
    21% and a single task restart does not create a lag spiral.

    **2. Latency budget as arithmetic (0–2).** Allocates the 200 ms: TLS and load balancer 4 ms,
    token validation 3, orchestration 3, feature multi-get 15, graph lookup 30, model ensemble 45,
    policy 3, serialisation 2 — 105 ms of p99 contributions, leaving 95 ms of headroom. The headroom
    is not padding: the p99 of a sum is not the sum of p99s, so a design that allocates 195 of 200 ms
    will miss the target most days. Names the hard deadline (the orchestrator cancels at 180 ms and
    returns the policy fallback), because a response that arrives at 240 ms is a decline by timeout
    and indistinguishable to the issuer from a fraud block. Forbids any per-feature database call:
    45 round trips at 3 ms each is 135 ms before the model even runs.

    **3. Feature path and state size (0–2).** Three freshness tiers, each with a mechanism. Velocity
    over 1/5/60 minutes is maintained in a stateful streaming job keyed by card_id; the state is 25M
    active cards x about 1.2 KB = 30 GB in RocksDB, checkpointed incrementally every 60 s, and only
    the 60-minute window is live — not 180 days. Graph features (device-to-account fan-out) are a
    5-minute micro-batch into a KV store, because a graph traversal at decision time cannot fit in
    30 ms. Merchant risk is a daily table. The serving tier reads all 45 features in one multi-get:
    25M cards x 2 KB = 50 GB of feature vectors, on three 32 GB primaries with a replica each —
    192 GB provisioned for 50 GB live, because losing a primary at peak must not halve throughput.
    Feature definitions live in one library used by both the streaming job and the training
    pipeline, and the training set is built with point-in-time joins so a value seen at decision
    time is reproducible at label time. A daily job recomputes 1% of decision-time vectors and
    alerts above 0.1% mismatch: that is the training-serving skew alarm, and without it the model
    decays silently while every dashboard stays green.

    **4. Decision policy from economics, not F1 (0–2).** This is where answers separate. 0.1% of
    259.2M is 259,200 fraudulent transactions/day, about $12.96M of exposure at a $50 ticket. The
    review queue holds 2,000 cases/day = 0.00077% of volume; even at an implausible 50% precision it
    catches 1,000 frauds, 0.4% of frauds. So review is not a control — it is for merchant onboarding
    and the top of the medium band, sorted by score and filtered to tickets above $250. Automated
    decline carries the load, and its threshold comes from break-even: a decline costs $8 when the
    customer is good and saves $50 when the transaction is fraud, so declining pays above
    8/50 = 16% precision. Set the decline band at p(fraud) above 0.30 for margin against drift; at
    90% precision that is 181,440 caught ÷ 0.9 = 201,600 declines, 0.078% of volume, costing 20,160
    false declines x $8 = $161k/day against $9.07M of fraud prevented. Bands: decline above 0.30;
    review from 0.05 to 0.30 subject to capacity; approve below 0.05, with step-up authentication
    for the 0.05-0.15 slice on high-value tickets. Every threshold change runs in shadow mode for a
    week first, because a threshold is a business decision that deserves evidence rather than a
    pull request.

    **5. Compute, failure and operations (0–2).** Inference: 45 ms of CPU per event at 5,000/s = 225
    vCPU-seconds per second, so 225 vCPU minimum and 450 at a 50% utilisation target — about 12
    nodes at 40 vCPU, roughly $13k/month at $0.04 per vCPU-hour (450 x 730 x 0.04). Headroom is 2x,
    not 1.5x, because losing a node at peak must not queue requests into the 200 ms window.
    Degradation is ordered and explicit: feature store unavailable, serve from the streaming job's
    queryable state; more than 20% of features missing, fall back to a rules model at 15 ms with a
    conservative decline threshold and log the fallback-rate SLI; model timeout, the same rules
    fallback; tickets above $500 fail closed to review rather than open. Duplicate authorisation
    retries are deduped on transaction_id with the decision cached for 60 s, so a retry cannot get a
    different answer. Watch p99 latency, fallback rate, decline rate by merchant, feature-store hit
    rate and score distribution — a two-point move in decline rate is either a model regression or a
    merchant under attack, and both need the same alarm. Labels arrive up to 120 days late, so train
    on a 90-day window with recency weighting and use the recent decline rate as the drift proxy
    until chargebacks land.

    **Automatic fail:** a database call per feature; no cold-start or missing-feature policy;
    choosing thresholds from a model metric with no reference to the cost of a false decline;
    claiming the streaming job and the training set compute identical features without
    point-in-time joins.
  red_flags:
    - A "fast model" with no vCPU or latency arithmetic.
    - A review queue sized to the fraud rate rather than to the people reviewing it.
    - Failing open on a timeout for high-value transactions.
    - Budgeting 195 of 200 ms and calling it done.

- id: sd-scn-009
  title: Move 38 TB off SQL Server into a lakehouse with no downtime
  technologies: [sql, spark, airflow]
  difficulty: advanced
  prompt: |
    A 12-year-old analytics estate runs on four SQL Server instances holding 38 TB across 1,900
    tables, of which about 600 are read by 3,500 BI users through 900 stored procedures. Traffic is
    40,000 queries a day, peaking at 120/s. Writes come from eleven source applications at an average
    of 1,500 rows/s, 1.2 KB each, peaking at 2,500/s. The link to the new cloud environment is 1
    Gbps, and the Spark cluster has 8 nodes.

    The business will not accept a maintenance window longer than 15 minutes, and any query that
    worked on Friday must return the same answer on Monday. Design the migration, the cutover, and
    the rollback, and be explicit about what you would leave behind.
  approach: |
    **Rubric — 5 bands, 2 points each (10 total).**

    **1. Define "zero downtime" before designing for it (0–2).** Zero downtime is not one property.
    Decompose it: read availability stays at the current 99.9%; no write freeze longer than 15
    minutes, once; no data loss (RPO 0 for committed rows); and answer parity — every consumer query
    returns the same result before and after. Naming four separate promises is what makes the rest
    of the design checkable, because each has a different mechanism. Also states what is out of
    scope: 240 of the 900 procedures have not executed in 30 days of instrumentation and are
    retired rather than migrated, which reduces the parity surface by 27% before any engineering
    starts. That triage is the highest-leverage decision in the project and candidates usually skip
    it.

    **2. The arithmetic that forces the plan (0–2).** A 1 Gbps link is 125 MB/s theoretical; at 70%
    efficiency it moves about 90 MB/s. 38 TB = 38,000,000 MB, so a raw copy is 38,000,000 ÷ 90 =
    422,222 s = 117 hours, or 4.9 days. Compressed on the wire at 3x for relational export, that is
    about 39 hours. Neither fits a 15-minute window, so the initial load must run alongside the live
    system and the cutover must be a *catch-up*, not a copy. CDC fills the gap: 1,500 rows/s × 1.2
    KB = 1.8 MB/s average = 6.5 GB/hour, so a 39-hour snapshot accumulates 39 × 6.5 = 253 GB of
    change. Applying at 40 MB/s drains that in 253,000 ÷ 40 = 6,325 s = 105 minutes. Therefore the
    realistic timeline is snapshot 39 h, catch-up 1.75 h, parity checks 2 weeks in parallel, cutover
    15 minutes. The other number that constrains the design is retention: SQL Server CDC keeps three
    days by default, and at 6.5 GB/hour that is 468 GB. If the connector falls more than about 36
    hours behind, the log truncates and the only recovery is a new snapshot — so lag is monitored
    against retention, alerted at 50%, and treated as a page, not a ticket.

    **3. Target architecture and the one trade-off that matters (0–2).** Bronze keeps the raw CDC
    payload immutable and append-only, partitioned by ingestion date, so a parsing bug is
    replayable. Silver applies changes into Iceberg tables with the source primary key, using a
    MERGE keyed by primary key and ordered by commit LSN; gold holds the marts the BI tools read.
    The trade-off to state explicitly: a warehouse-managed table gets query performance and
    concurrency for free and would cut parity time, while an open format keeps every engine able to
    read the same bytes and makes the rollback cheap because SQL Server still owns the data. Given
    the 3,500 users and 120/s peak, the recommendation is an open table format with a warehouse or
    Trino reading it, and the honest admission that the first month of query tuning will be spent
    recovering the indexes SQL Server gave away for free. Two correctness details that decide
    whether parity holds: a business transaction touching three tables arrives as three independent
    row events, so silver applies with a 60-second commit-order buffer rather than row by row, or
    readers see half a transaction; and type mapping needs a written table — datetime2 to timestamp
    at microsecond precision, money to decimal(19,4), nvarchar to UTF-8 with a collation decision,
    identity columns replaced by source keys, computed columns recomputed in silver, and triggers
    that CDC never captures reimplemented as downstream logic.

    **4. Parallel run, cutover and rollback (0–2).** Parity is measured, not asserted: 200 golden
    queries run nightly against both systems for two weeks, comparing exact row counts, sums within
    0.01%, and a 1% row-level hash sample, with failures triaged into mapping bugs versus genuine
    semantic differences. Cutover is per consumer group, not big bang, behind a routing layer that
    can point a report at either system. The 15-minute window holds a short write freeze on the
    eleven source applications, waits for CDC lag to reach zero (verified by LSN, not by eyeballing
    a dashboard), flips the connection strings, runs 20 smoke queries, and unfreezes. Rollback
    inside the window is a flip back. Rollback after it is the part candidates miss: it is only free
    if the lakehouse accepted no writes. So the design deliberately keeps SQL Server as the only
    writable system of record for the duration of the migration, and any table that must become
    writable afterwards gets reverse CDC in a separate, later project. Making the lakehouse writable
    during cutover converts a cheap rollback into a bidirectional reconciliation problem.

    **5. Failure modes and grading (0–2).** Names the failures that actually happen: CDC lag
    approaching log retention; snapshot read pressure slowing the production server (throttle to 60%
    of link capacity, run off-peak, use read-committed snapshot isolation rather than locking
    hints); schema drift from a source adding a column mid-migration, handled by schema evolution
    rather than a failed MERGE; late-arriving dimension rows breaking referential joins in gold;
    row-level security not replicated, which is a data-exposure incident rather than a bug; Power BI
    dataset refresh failing on a renamed column; and cost drift from a Spark cluster left running
    after the backfill. Operations: a migration dashboard with lag, parity pass rate and cost; a
    named owner per consumer group; and a written abort condition — if parity is below 98% on the
    golden set at T-3 days, the cutover is postponed rather than negotiated.

    **What to leave behind.** The 240 unused procedures, the SSRS reports nobody opened in 90 days,
    the 280 procedural jobs that mix T-SQL control flow with data movement (phase 2, rewritten as
    orchestrated jobs rather than translated line by line), and any table under 1 GB that a single
    application reads — moving it buys nothing and adds a network hop.

    **Automatic fail:** a big-bang weekend cutover; copying 38 TB inside a maintenance window;
    no parity harness; making the lakehouse writable before rollback is proven.
  red_flags:
    - Lift-and-shift with a managed copy tool and no throughput arithmetic.
    - Migrating all 900 procedures one for one.
    - No rollback story beyond "restore the backup".
    - Ignoring CDC log retention while the snapshot runs for two days.

- id: sd-scn-010
  title: A permissions-aware assistant over 2 million internal documents
  technologies: [python, sql]
  difficulty: advanced
  prompt: |
    An engineering organisation wants an assistant over its internal corpus: 2 million documents
    (design docs, runbooks, contracts, HR files) averaging ten pages, held in four systems with
    their own ACLs. There are 4,000 permission groups; a document belongs to 3.2 on average and a
    user to 12, with nesting that can expand to 60 effective principals. Traffic is 30,000 questions
    a day, peaking at 8/s, with time-to-first-token under 2 s and full answers under 10 s. The
    budget is $12,000 a month.

    Legal requires that a user never sees text from a document they cannot open, that revoked access
    takes effect within minutes, and that document text is not retained by the model provider.
    Design the retrieval path, the permission model, and the evaluation that proves it works.
  approach: |
    **Rubric — 5 bands, 2 points each (10 total).**

    **1. Corpus and cost arithmetic (0–2).** 2M documents × 10 chunks = 20M chunks; at about 500
    tokens each that is 10 billion tokens. Embedding once at $0.02 per million tokens is
    10,000 × 0.02 = $200, which sounds free and is the wrong conclusion: at 5,000 chunks per minute
    the pipeline needs 20,000,000 ÷ 5,000 = 4,000 minutes = 67 hours. The constraint is throughput,
    not spend, so chunk-level incremental re-embedding is mandatory and a monthly full rebuild is
    not available as an operational habit. Query cost: 8 chunks × 500 = 4,000 context tokens, plus
    300 system and 200 question = 4,500 input; at $3/M input and $15/M output that is $0.0135 +
    350 × 15/1M = $0.00525, so $0.01875 per answer. At 30,000/day that is $562.50/day = $16,875 per
    30-day month — 41% over budget. The fix is arithmetic, not a cheaper model: a 35% exact and
    near-duplicate cache hit rate leaves 19,500 unique answers × $0.01875 = $365.63/day = $10,969,
    inside budget. A second lever is context pruning to 6 chunks, 3,500 input tokens, $0.01575 per
    answer, $9,214/month.

    **2. Index sizing and retrieval (0–2).** 20M × 1,536 × 4 B = 122.9 GB of raw vectors, and an
    HNSW graph at roughly 50% overhead makes it 184 GB. This is the number that decides the
    architecture: it does not fit one node, unlike a 2M-chunk corpus, so the index is sharded eight
    ways at about 23 GB each, with queries fanned out and merged. Retrieval is hybrid — BM25 for
    exact identifiers (error codes, service names) plus vectors for paraphrase — 50 candidates,
    reranked to 8. The rerank budget is real: a cross-encoder at 3 ms per pair over 50 candidates is
    150 ms, and at 8 ms it is 400 ms, which is why the small reranker is the default. Chunking
    respects document structure (headings, tables kept whole) and stores a parent-document id so a
    retrieved chunk can expand to its section for the prompt without embedding the whole document.

    **3. Permissions: the part that is actually hard (0–2).** The naive design filters after
    retrieval, and the arithmetic kills it: if a user can open 2% of the corpus, the top 50
    unfiltered candidates yield an expected 50 × 0.02 = 1 authorised chunk, so recall collapses
    exactly for the users with the narrowest access — the ones most likely to hold sensitive
    documents. The design is pre-filter plus verify. Retrieval carries a coarse filter derived from
    the document's owning workspace (a bounded set, so the ANN index can use it efficiently), and
    then every candidate is verified against the authorisation service in one batched call of 50 ids
    at about 10 ms. That second check is what makes revocation take effect in seconds rather than at
    the next index rebuild: ACLs are never baked into the vector index, only the coarse workspace is,
    and group membership is expanded at query time to at most 60 principals with a 60-second cache.
    Three consequences to state: the cache key must include a hash of the principal set, never just
    the question, or one user's answer is served to another; the answer must refuse without naming
    the document, because "you cannot access the Q3 layoff plan" is itself a disclosure; and
    deletions and ACL changes emit a tombstone so a chunk stops being retrievable immediately, with
    the vector physically removed on the next compaction.

    **4. Serving, latency and failure (0–2).** Budget: question embedding 30 ms, sharded vector
    search 40, batched authz 10, rerank 150, prompt assembly 20 = 250 ms before the model; prefill of
    4,500 tokens at 3,000 tokens/s = 1,500 ms, so TTFT is about 1.75 s against a 2 s target, and 350
    output tokens at 60 tokens/s = 5.8 s, total 7.6 s inside the 10 s target. Streaming is required,
    and the output cap is the latency control. Citations are generated from retrieved ids, not from
    the model's prose, and validated after generation: an answer citing an id that was not in the
    context is discarded. Retrieved text is data, never instructions, and each chunk is delimited and
    stripped of imperative-looking markup, because a runbook containing "ignore previous
    instructions" is a real injection vector in an internal corpus. Provider outage degrades to a
    sources-only response listing the top passages with titles and links, which is genuinely useful
    and keeps the product up. Legal's retention requirement is met by a zero-retention endpoint with
    a contractual guarantee and no logging of prompts at the provider, or by self-hosting the model —
    and the audit log of which documents were shown to whom lives on our side, 30,000 × 395 days =
    11.85M rows at about 2 KB = 24 GB, cheap and non-negotiable for a compliance review.

    **5. Evaluation, including the security tests (0–2).** A 400-question golden set with expected
    document ids and required facts, scored on retrieval recall@8, answer faithfulness, citation
    validity and refusal correctness. Then the suite that most teams omit: 100 leakage questions
    whose answers exist only in documents a test user cannot open, run as that user, with any
    content from those documents treated as a release blocker; a revocation test that removes access
    and asserts the answer changes within five minutes; and a deleted-document test. Regression gate
    of two points on the golden set before any prompt or model change, versioned prompts, and 1%
    human review of production answers. Report cost per answered question alongside quality, because
    the cheapest way to improve this system's numbers is to answer fewer questions well.

    **Automatic fail:** post-filtering only, with no analysis of recall for restricted users; ACLs
    embedded in the index with no revocation path; caching answers without the principal set in the
    key; claiming the model cannot leak text it was given.
  red_flags:
    - Treating permissions as a metadata filter bolted on after the vector search.
    - A per-user index, or one index per group, at 20M chunks.
    - Answering "that document is restricted" instead of refusing.
    - No leakage test, and an evaluation set built only from documents the test user owns.
