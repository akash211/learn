  {
    "id": "api-recent-012",
    "topic": "api architecture",
    "difficulty": "intermediate",
    "question": "When does a BFF provide value, and how does it differ from a gateway?",
    "answer": "A backend-for-frontend is an application service shaped for a specific client, aggregating or adapting data to reduce client complexity and round trips. An API gateway is more often an infrastructure layer for routing, TLS termination, coarse controls, and shared telemetry. They solve different problems and can coexist. A BFF adds operational and failure boundaries, so it needs ownership, explicit downstream deadlines, and an authorization model. A gateway cannot replace domain authorization, and a BFF should not become an unowned duplicate of business rules. Use client-specific composition when it earns its extra hop. Define partial-response behavior and failure handling so the client can tell required data from optional enrichment. Keep product composition in the BFF and transport-wide controls in the gateway where that ownership is clear. Both layers still need telemetry and incident responsibility.",
