    "topic": "oauth security",
    "difficulty": "advanced",
    "question": "How should a new OAuth client choose a flow under current security guidance?",
    "answer": "For a user-facing public client, use Authorization Code with PKCE and carefully validate redirect handling. A confidential web application can use the authorization-code flow with client authentication as appropriate. A service acting as itself may use Client Credentials when allowed by policy. RFC 9700 (2025) updates OAuth security best current practice and discourages legacy implicit and resource-owner-password flows. OAuth access tokens authorize resource access; OpenID Connect provides an identity layer when sign-in claims are needed. Do not assume the grant name alone secures the integration. Validate tokens at the resource server, restrict audience and scope, protect secrets, and review redirect and refresh-token handling. Flow selection depends on client type and threat model. Reassess refresh-token storage, redirect URI matching, and PKCE verifier handling whenever the client platform changes.",
