    "id": "api-recent-009",
    "topic": "api contracts",
    "difficulty": "intermediate",
    "question": "What is the difference between an OpenAPI document and a runtime-enforced contract?",
    "answer": "OpenAPI describes an HTTP API in a language-agnostic form, including paths, operations, schemas, and responses. It can drive docs, generated clients, and validators, but it does not enforce behavior by itself. A document can validate syntactically while the service returns undocumented errors or skips authorization. Runtime checks, integration tests, and compatibility checks are needed to prove conformance. Pin the OpenAPI version and make sure tooling understands the features used; schema support can differ among generators and gateways. Treat published examples as test fixtures and verify headers and status codes as well as body shape. A contract is useful when implementation and clients are continuously checked against it. CI should test generated clients and live responses, not just parse the YAML. Correct documentation is a necessary interface artifact, but not an enforcement mechanism.",
    "tags": [
      "api-contracts",
      "http-api"
    ],
    "period": "2024-2026",
    "type": "representative"
