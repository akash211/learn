    "id": "api-recent-006",
    "topic": "http caching",
    "difficulty": "intermediate",
    "question": "What happens when a stale cached GET is revalidated with If-None-Match?",
    "answer": "The client sends the ETag it has in `If-None-Match`. If the selected representation still matches, the server can answer `304 Not Modified` without a body; the cache updates metadata and reuses the stored representation. If it changed, the server returns a full response with the new representation and validator. The ETag is opaque. A 304 is not a standalone copy of the resource, so a client that discarded the body cannot reconstruct it from the response. Use `Cache-Control` to state freshness and revalidation policy, and include `Vary` when request headers select variants. Verify behavior through intermediaries, not just application tests. An ETag should identify the selected representation consistently, including relevant negotiated variants. Caching policy determines whether the response is fresh or must be checked again.",
    "tags": [
      "http-caching",
      "http-api"
    ],
    "period": "2024-2026",
    "type": "representative"
  },
  {
    "id": "api-recent-007",
    "topic": "conditional writes",
    "difficulty": "advanced",
    "question": "How can If-Match prevent lost updates in an API?",
    "answer": "A client retrieves a representation with a strong ETag, then sends that tag in `If-Match` on a write. The server applies the change only if the current representation still matches; if not, it returns `412 Precondition Failed`. This is optimistic concurrency control and prevents a stale client from overwriting a newer change silently. The client can fetch the latest representation and reconcile. Weak validators are not suitable where strong comparison is required. A domain conflict unrelated to a failed HTTP precondition may instead use 409. Test two clients editing the same resource concurrently, including a lost response. Document whether clients must supply the precondition and how a missing If-Match is handled. This pattern requires a reliable strong validator and consistent precondition handling. It is especially valuable for editors and workflows where overwriting another user’s changes is unacceptable.",
    "tags": [
      "conditional-writes",
      "http-api"
    ],
    "period": "2024-2026",
    "type": "representative"
  },
  {
    "id": "api-recent-008",
    "topic": "rate limiting",
    "difficulty": "intermediate",
    "question": "What should a client infer from 429 and Retry-After?",
    "answer": "RFC 6585 defines 429 Too Many Requests for rate limiting. The response may include `Retry-After` indicating when the client should try again, expressed as a delay or date. The RFC does not define how the server identifies a user or counts requests; policy can be per resource, principal, or service. A client should honor the hint within its own deadline, use bounded backoff with jitter when appropriate, and avoid synchronized immediate retries. The status does not reveal a universal quota or rate-limit algorithm. Document which calls are safe to retry and whether a retry-after value is advisory. Keep SDK and gateway retries from multiplying attempts beyond service capacity. Rate limit policies and field conventions can differ by service. SDKs should cap retries and share a deadline budget instead of assuming every 429 has an identical quota model.",
