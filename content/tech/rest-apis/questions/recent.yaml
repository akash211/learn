    "id": "api-recent-010",
    "topic": "problem details",
    "difficulty": "intermediate",
    "question": "How should an API use RFC 9457 extensions for field validation errors?",
    "answer": "RFC 9457 allows a problem type to define extension members beyond the common fields. A validation problem can use an `errors` array containing stable machine codes and field locations, such as JSON Pointers, while `detail` provides a human-readable explanation. Clients should not parse freeform text, and they should ignore extensions they do not recognize. Use a stable `type` URI for the error class and keep the HTTP status aligned with the status member if present. Avoid echoing sensitive input and keep extension types documented. Deterministic ordering and stable codes make it easier for clients to map errors to controls without depending on localization. Use stable problem types and structured extension fields so clients can recover without parsing translated prose. The public response should help correction, not expose implementation diagnostics.",
