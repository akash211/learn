    "id": "api-recent-011",
    "topic": "service resilience",
    "difficulty": "advanced",
    "question": "How should an API budget timeouts across multiple downstream calls?",
    "answer": "Set bounded connect and response timeouts for every downstream call, plus an overall deadline for the caller’s request. Include queue wait and retry delays in the budget; three independent long timeouts can exceed the client’s deadline. Propagate remaining time where safe and stop work when the caller can no longer benefit. A timeout does not cancel a remote side effect reliably, so writes still need idempotency or reconciliation. Track downstream latency and timeouts by dependency and route. Avoid universal timeout numbers: choose budgets from measured latency and service objectives. Test a hung dependency, a slow response body, and a request that times out after a downstream commit. Timeouts should be configured per dependency and operation. Measure queueing and retries as part of total latency, then tune from service objectives rather than arbitrary defaults.",
