    "id": "api-recent-004",
    "topic": "api compatibility",
    "difficulty": "intermediate",
    "question": "Why can an apparently additive API schema change still break clients?",
    "answer": "Adding an optional response field is often compatible, but only if clients tolerate unknown properties. Adding an enum value can break generated code with exhaustive switches or strict decoders. A new default, changed ordering, or a new status code can also change behavior without removing a schema field. Compatibility must be assessed against real SDKs and consumers, not just a syntactic schema-diff rule. Keep error and pagination semantics stable, and use a deliberate deprecation path for fields that need replacement. A CI diff can identify likely risks, but integration tests with representative client versions catch assumptions the schema cannot express. Record actual client behavior before classifying a change as safe. Before shipping, compile and run the consumer SDKs that matter. Compatibility is an operational property of clients in use, not only a theoretical schema relation.",
