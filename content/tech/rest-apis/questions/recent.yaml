    "id": "api-recent-005",
    "topic": "retries",
    "difficulty": "intermediate",
    "question": "A POST times out after submitting a payment. What should the client do?",
    "answer": "The timeout does not prove the payment was not created; the server may have committed the charge and lost only the response. The client should not submit a new logical payment blindly. If the API defines an idempotency key, retry the exact operation with the same key and payload so the server can replay or reconcile the original outcome. The server must scope the key, atomically deduplicate concurrent requests, reject same-key/different-payload use, and document retention. Idempotency keys are application behavior rather than a universal guarantee of HTTP POST. If no deduplication or lookup mechanism exists, the client may need operator-assisted reconciliation. Test a dropped response after commit and ensure retries preserve the key. The key must be recorded atomically with operation processing, and concurrent duplicates must converge on one outcome. A new key represents a new logical action.",
