    "id": "api-recent-003",
    "topic": "token validation",
    "difficulty": "advanced",
    "question": "Why is decoding a JWT not enough to authenticate an API request?",
    "answer": "JWT payloads are encoded, not necessarily encrypted. Anyone holding one can often read its claims, and base64url decoding says nothing about authenticity. The resource server must verify a signature using a trusted key and allowed algorithm, then check issuer, audience, expiry and any other required constraints. It must also apply authorization policy; a valid token can still lack permission for a particular order or tenant. Token format and validation rules come from JWT specifications and the issuer/resource-server agreement, not from OAuth alone. Do not fetch arbitrary verification keys from untrusted token headers. Test wrong issuers and audiences, expired tokens, key rotation, malformed signatures, and revoked or disabled principals. The issuer and audience checks bind a token to a trusted authority and intended resource server. Authorization still has to evaluate the requested object and action.",
    "tags": [
      "token-validation",
      "http-api"
    ],
    "period": "2024-2026",
    "type": "representative"
