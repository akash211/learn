    "id": "api-recent-001",
    "topic": "error contracts",
    "difficulty": "intermediate",
    "question": "What does RFC 9457 add to HTTP API error responses, and which status value should clients trust?",
    "answer": "RFC 9457 standardizes a problem-details object, commonly served as `application/problem+json`, so an API can add machine-readable context without redefining HTTP status semantics. Its members include `type`, `title`, `status`, `detail`, and `instance`; APIs may define extensions such as structured validation errors. The actual HTTP response status is authoritative for generic HTTP software. If the optional body `status` member is present, the generator must make it agree with the response status. Clients should branch on stable problem types or documented extension codes, not prose in `detail`. The format does not require exposing internals. Keep stack traces and sensitive values out of public errors, and make unknown extension members safe for clients to ignore. The standard’s purpose is common error structure, not a license to invent new HTTP meanings. Keep the API status line correct for caches, proxies, and generic clients.",
