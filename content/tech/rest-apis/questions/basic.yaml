    "id": "api-basic-020",
    "topic": "authentication",
    "difficulty": "beginner",
    "question": "Why is OAuth 2.0 primarily an authorization framework, not a login protocol?",
    "answer": "OAuth 2.0 defines how a client obtains an access token representing permission to access protected resources. It separates the client from the resource owner and gives the client a token rather than the user’s password. The protocol does not standardize how the authorization server authenticates the user or define an identity claim format. OpenID Connect adds an identity layer and ID tokens for sign-in. An OAuth access token is intended for resource authorization and should not automatically be treated as proof of user identity. Keep the API’s audience and token validation explicit. If an application needs sign-in identity, use a documented identity protocol and validate its issuer, audience, signature, and nonce where applicable. Separate credential verification from the decision to allow a specific action on a specific resource. Apply least privilege and test denied cases, wrong audiences, stale permissions, and credential rotation. Keep tokens out of URLs and logs, and design revocation or expiry behavior explicitly.",
