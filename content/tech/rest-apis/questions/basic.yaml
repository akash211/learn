    "topic": "http semantics",
    "difficulty": "intermediate",
    "question": "Why does a 401 response need a WWW-Authenticate header, and how does 403 differ?",
    "answer": "401 indicates that valid authentication credentials are missing or unacceptable; HTTP requires a WWW-Authenticate challenge in a 401 response. 403 indicates that the server understood the request but refuses to fulfill it, commonly because the authenticated principal lacks permission. Re-authenticating does not necessarily fix a 403. The word “Unauthorized” in 401 is historical, so it is clearer to reason about whether the caller has presented acceptable credentials and whether policy allows the operation. An API can intentionally return 404 instead of 403 when disclosing an object’s existence would leak sensitive information. Choose and document a consistent concealment policy for object-level access. Test both missing credentials and an authenticated-but-forbidden principal, including their response headers and error shapes. In a design review, write the exact request and response pair and check what a generic HTTP client can infer without understanding your domain. Verify headers and body rules as well as the status. Consider retries after a lost response, because that is where semantic mistakes become duplicate writes.",
