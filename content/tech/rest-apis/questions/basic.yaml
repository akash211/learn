    "id": "api-basic-022",
    "topic": "authorization",
    "difficulty": "intermediate",
    "question": "Why are OAuth scopes insufficient for object-level authorization?",
    "answer": "A scope such as `orders:read` says the token may perform a class of action, but it normally does not determine which specific order the caller may access. The resource server must evaluate ownership, tenant membership, relationships, and business state for the requested object. Otherwise an authenticated user can substitute another identifier and access data outside their scope. Apply the same checks to item endpoints, nested resources, expansions, and collection results. Unguessable identifiers reduce enumeration but do not enforce permission. Test cross-tenant IDs and denied actions as deliberately as successful requests. Keep authorization checks close to the resource operation and avoid relying on client-side visibility filters. Model authorization as an action, principal, resource, and current-state decision. Test the negative path with a different tenant or object identifier; client-side filtering and unguessable IDs do not enforce the policy. Return consistent failures without disclosing sensitive resource existence.",
