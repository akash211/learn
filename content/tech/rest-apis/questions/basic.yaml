    "id": "api-basic-011",
    "topic": "versioning",
    "difficulty": "beginner",
    "question": "What kinds of changes are likely to break API clients?",
    "answer": "Removing or renaming a field, changing a field’s type or meaning, making an optional request field required, narrowing an enum, changing a default, or altering status and error behavior can break clients. Even an added response enum value may break generated clients with exhaustive switches. Compatibility depends on real client behavior, not only a schema rule. Additive optional fields are often safe for tolerant clients, but strict deserializers may reject them. A change should be reviewed against representative consumers and tests. Write down the compatibility policy and check both request and response handling. A schema diff can flag risk, but clients may rely on ordering, nullability, error details, or timing that a schema does not capture. Use real consumer behavior to decide compatibility rather than assuming every client is tolerant. Review generated clients, default values, enums, and error handling. Maintain a migration path and usage measurements so a version policy has a practical end date rather than an indefinite promise.",
    "tags": [
      "versioning",
      "http-api"
    ]
  },
  {
    "id": "api-basic-012",
    "topic": "versioning",
    "difficulty": "intermediate",
    "question": "Compare URI versioning with header-based versioning.",
    "answer": "URI versioning makes the contract visible in paths such as `/v2/orders`, which is easy to debug, route, cache, document, and test. Header or media-type versioning can keep the resource URI stable, but clients must consistently send the selector and caches must vary on it; otherwise one version’s representation could be served to another. Neither strategy removes the cost of maintaining old behavior. Choose one policy with clear compatibility guarantees, then make gateways, SDKs, logs, and OpenAPI descriptions apply it consistently. A version label is useful only if the provider preserves the promised behavior. Avoid date-based or header version strings that are accepted but have no real support policy behind them. Use real consumer behavior to decide compatibility rather than assuming every client is tolerant. Review generated clients, default values, enums, and error handling. Maintain a migration path and usage measurements so a version policy has a practical end date rather than an indefinite promise.",
