    "id": "api-basic-009",
    "topic": "uri design",
    "difficulty": "intermediate",
    "question": "Should nested resources always use deeply nested paths?",
    "answer": "No. Nest a resource when the parent provides meaningful context, scoping, or a relationship that clients naturally navigate, such as `/customers/c_1/orders`. Avoid repeating the full ancestry when the child has an independent identity and lifecycle; `/orders/o_9` can be the canonical URI. Deep paths become brittle when relationships change, can duplicate identifiers, and may complicate authorization checks. Link to related resources or return their stable IDs. A collection can be nested even when individual items have top-level canonical URIs. A useful review asks whether a child is only addressable through its parent. Keep depth modest, enforce authorization at the actual resource, and document canonical item identifiers. Treat the route as a durable public identifier, then review how it behaves in logs, links, caches, authorization checks, and client SDKs. Clients should not need to know database internals. The server must still validate object access even when identifiers are opaque or difficult to guess.",
