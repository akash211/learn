    "id": "api-basic-005",
    "topic": "http semantics",
    "difficulty": "intermediate",
    "question": "When is PUT preferable to PATCH?",
    "answer": "PUT requests that the target resource be created or replaced by the representation supplied. It is appropriate when the client knows the target URI and can send the complete desired state. PATCH applies a partial modification using a defined patch format and semantics; the behavior depends on that format and is not automatically idempotent. A common bug is implementing PUT as “update only keys supplied,” which makes it behave like a patch while clients expect replacement. If partial updates are required, document whether omitted fields remain unchanged, become null, or are removed, and protect concurrent changes with validators where needed. Do not choose a method from the payload shape alone. Test repeated requests and missing-field behavior, and state what a successful follow-up GET should represent. In a design review, write the exact request and response pair and check what a generic HTTP client can infer without understanding your domain. Verify headers and body rules as well as the status. Consider retries after a lost response, because that is where semantic mistakes become duplicate writes.",
