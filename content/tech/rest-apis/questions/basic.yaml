    "id": "api-basic-017",
    "topic": "caching",
    "difficulty": "beginner",
    "question": "How do ETag and If-None-Match reduce bandwidth?",
    "answer": "A response can include an ETag that identifies a selected representation. When the cached response becomes stale, a client sends `If-None-Match` with that validator. If the representation has not changed, the server returns 304 Not Modified without the representation body, and the client reuses its stored copy. If it changed, the server returns the new body and a new validator. The client treats the ETag as opaque. It can represent a revision or content hash, but must change consistently when the representation changes. A 304 is useful only when the client or cache still has the old body. Test revalidation through intermediaries, and do not send a body with 304. Check behavior at the actual shared and private caches, including freshness, validators, variant selection, and personalized data. Cache directives are part of the security boundary. A correct origin response can still be unsafe if an intermediary reuses it for the wrong audience.",
    "tags": [
      "caching",
      "http-api"
    ]
  },
