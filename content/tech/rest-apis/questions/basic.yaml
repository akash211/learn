    "id": "api-basic-003",
    "topic": "http semantics",
    "difficulty": "beginner",
    "question": "When should an API return 201, 202, or 204?",
    "answer": "Return 201 Created when the request created a resource; a Location header commonly identifies it. Return 202 Accepted when work has been accepted but is not finished, and provide a way to observe its state, often an operation resource. Return 204 No Content when the operation succeeded and there is deliberately no response representation. They express different completion and body expectations, so they should not be treated as interchangeable success codes. For example, a synchronous create can return 201 and the new representation; a queued export can return 202 and a status URI. Keep status and body consistent: clients may act on the status before parsing JSON. A 204 response should not carry a body that clients are expected to consume. In a design review, write the exact request and response pair and check what a generic HTTP client can infer without understanding your domain. Verify headers and body rules as well as the status. Consider retries after a lost response, because that is where semantic mistakes become duplicate writes.",
