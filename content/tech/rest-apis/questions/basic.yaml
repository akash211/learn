    "id": "api-basic-007",
    "topic": "uri design",
    "difficulty": "beginner",
    "question": "What makes an API URI resource-oriented?",
    "answer": "A resource-oriented URI identifies a domain concept or collection, while the HTTP method expresses the requested operation. For example, `/orders/o_123` identifies an order, and GET, PATCH, or DELETE express different actions on it. `/orders` identifies the collection and can support listing or creation. A URI does not need to match a database table, and a resource may aggregate data from multiple internal systems. Stable public identifiers let clients address entities without learning internal joins or storage structure. Design around the client’s tasks and domain lifecycle. If the route exposes ORM names or requires clients to know database relationships, the API is coupling its contract to implementation. Treat the route as a durable public identifier, then review how it behaves in logs, links, caches, authorization checks, and client SDKs. Clients should not need to know database internals. The server must still validate object access even when identifiers are opaque or difficult to guess.",
    "tags": [
      "uri-design",
      "http-api"
    ]
  },
  {
    "id": "api-basic-008",
    "topic": "uri design",
    "difficulty": "beginner",
    "question": "When should a collection endpoint use query parameters?",
    "answer": "Use query parameters to select or shape a collection: filters, sort order, pagination size, or an explicit field projection. For example, `/orders?status=pending&limit=25` remains a collection URI with a selected view. Define parameter types, allowed values, default behavior, and how multiple filters combine. Do not place secrets in URLs because they can be logged or copied into history. Complex searches may exceed URL limits or expose sensitive criteria; a documented POST search endpoint can be appropriate if its query semantics are clear and it does not mutate domain state. Treat all query input as untrusted, cap expensive page sizes, and separate filtering from authorization. A caller-provided tenant filter never proves permission to read that tenant. Treat the route as a durable public identifier, then review how it behaves in logs, links, caches, authorization checks, and client SDKs. Clients should not need to know database internals. The server must still validate object access even when identifiers are opaque or difficult to guess.",
    "tags": [
