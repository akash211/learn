    "id": "api-basic-019",
    "topic": "caching",
    "difficulty": "intermediate",
    "question": "When is Vary required?",
    "answer": "Vary names request headers that influenced response selection so a cache can distinguish representations. If the body depends on `Accept-Language`, returning `Vary: Accept-Language` prevents a cache from serving one language’s response for another request. Similarly, content negotiation by Accept may require Vary. Omitting it can cause incorrect variants or, in some designs, cross-user data exposure. Varying on too many high-cardinality headers can fragment a cache and reduce hit rates, so only list genuine selection dimensions. Review every response branch and middleware layer that changes content. Test cache keys with differing headers and verify that authentication-sensitive responses are not accidentally shared. Check behavior at the actual shared and private caches, including freshness, validators, variant selection, and personalized data. Cache directives are part of the security boundary. A correct origin response can still be unsafe if an intermediary reuses it for the wrong audience.",
