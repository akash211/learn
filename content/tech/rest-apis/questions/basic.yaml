    "id": "api-basic-010",
    "topic": "uri design",
    "difficulty": "intermediate",
    "question": "Why should APIs avoid exposing secrets in URI paths or query strings?",
    "answer": "URIs frequently appear in web server and proxy logs, browser history, analytics, referrer information, and support captures. A password, access token, personal datum, or one-time secret embedded in a URL can spread beyond the intended request path and remain available longer than expected. Use Authorization headers or request bodies according to the protocol and security design, and redact sensitive values at every logging layer. Avoid putting secrets in path identifiers as well as query parameters. TLS protects transit, but it does not prevent the URL from being logged at endpoints. If a secret has already appeared in a URL, remove it from future logs where possible and rotate or revoke it. Treat opaque IDs as identifiers, not as authorization credentials. Treat the route as a durable public identifier, then review how it behaves in logs, links, caches, authorization checks, and client SDKs. Clients should not need to know database internals. The server must still validate object access even when identifiers are opaque or difficult to guess.",
