    "id": "api-basic-002",
    "topic": "http semantics",
    "difficulty": "beginner",
    "question": "How are idempotency and safety different?",
    "answer": "Safety concerns whether the method requests a state change; idempotency concerns whether repeating the same request has the same intended effect as performing it once. GET is both safe and idempotent. PUT and DELETE are unsafe but idempotent: they request a change, yet repeating the request should not change the intended final state again. POST is not inherently idempotent. These properties do not require identical response codes or forbid logging each attempt. A repeated DELETE can return 404 after the first returned 204 and still leave the target absent. Use idempotency to decide whether automatic retries can be safe after an uncertain network outcome; it does not eliminate rate, latency, or side-effect concerns outside the requested effect. In a design review, write the exact request and response pair and check what a generic HTTP client can infer without understanding your domain. Verify headers and body rules as well as the status. Consider retries after a lost response, because that is where semantic mistakes become duplicate writes.",
