    "id": "api-basic-014",
    "topic": "pagination",
    "difficulty": "beginner",
    "question": "What is the main difference between offset and cursor pagination?",
    "answer": "Offset pagination requests a position such as `limit=20&offset=40`; it is simple and supports approximate page jumps but can become expensive for deep offsets and drift when rows are inserted or removed. Cursor pagination continues from a stable ordering key, often encoded in an opaque token. It scales better for large feeds and avoids some offset shifts, but usually does not support jumping to arbitrary page numbers. Both require deterministic sorting; a unique tie-breaker prevents equal timestamps from causing duplicates or omissions. Choose based on client navigation, data size, and consistency needs. For snapshot exports, ordinary page cursors may not guarantee a point-in-time view; design a separate snapshot or export workflow. Test the exact ordering and boundary conditions at page transitions, including equal sort values and concurrent writes. Bound the amount of work per request and repeat authorization checks on every page. State whether traversal is a snapshot or only a best-effort view of a changing collection.",
    "tags": [
      "pagination",
      "http-api"
    ]
