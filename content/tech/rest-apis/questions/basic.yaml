  {
    "id": "api-basic-013",
    "topic": "versioning",
    "difficulty": "intermediate",
    "question": "How should an API deprecate an operation?",
    "answer": "A deprecation should identify the replacement, explain migration steps, give a realistic support or sunset window, and reach the affected consumers through channels they use. Keep the old behavior working during the announced transition, measure remaining usage with privacy-conscious telemetry, and offer a contact path for client issues. A response header or changelog entry alone may not be enough. Internal clients also need migration coordination because independent deployments create the same compatibility risk as public integrations. Do not deprecate an endpoint without knowing who owns the remaining callers. Announce the timeline early, provide examples, and verify actual version traffic before disabling the route. Use real consumer behavior to decide compatibility rather than assuming every client is tolerant. Review generated clients, default values, enums, and error handling. Maintain a migration path and usage measurements so a version policy has a practical end date rather than an indefinite promise.",
