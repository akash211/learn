    "id": "api-basic-016",
    "topic": "filtering",
    "difficulty": "intermediate",
    "question": "How should an API design sorting and filtering options?",
    "answer": "Expose a documented whitelist of public filter and sort fields rather than accepting arbitrary database expressions. Define types, operators, allowed values, timezone and null behavior, and whether multiple filters combine with AND or OR. Sorting must be deterministic and should include a stable tie-breaker when paging. A misspelled filter should produce a clear validation response or follow a clearly documented ignore policy; silent failure can produce plausible but wrong results. Apply authorization constraints independently of user-provided filters. Bound expensive filters and test query plans for supported combinations. Public query syntax becomes a client contract, so adding expressive complexity should be balanced against operation cost and SDK usability. Keep public query semantics stable and separate from storage expressions. Bound costly combinations and test supported filters with realistic query plans. Authorization is always applied independently; filtering results down to a requested owner or tenant is not a substitute for an access-control decision.",
