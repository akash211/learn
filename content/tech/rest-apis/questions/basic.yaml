    "id": "api-basic-001",
    "topic": "http semantics",
    "difficulty": "beginner",
    "question": "What does it mean for an HTTP method to be safe?",
    "answer": "A safe method means the client does not request a state change as part of the method semantics. GET, HEAD, OPTIONS, and TRACE are defined as safe by RFC 9110. Safe does not mean the server performs zero side effects: logging and metrics can still occur. The important boundary is that the client did not ask to mutate the target. This lets browsers, crawlers, and caches retrieve resources without fearing that reading a link will delete or purchase something. A route that performs a destructive action through GET violates this expectation, even if its URL contains an action parameter. Review automated callers as well as human clients: prefetching and link checkers may issue GET without user intent. Put changes behind an unsafe method and test that GET has no domain mutation. In a design review, write the exact request and response pair and check what a generic HTTP client can infer without understanding your domain. Verify headers and body rules as well as the status. Consider retries after a lost response, because that is where semantic mistakes become duplicate writes.",
    "tags": [
      "http-semantics",
      "http-api"
    ]
