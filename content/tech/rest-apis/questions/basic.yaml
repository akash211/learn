    "id": "api-basic-021",
    "topic": "authentication",
    "difficulty": "intermediate",
    "question": "What problem does Authorization Code with PKCE solve?",
    "answer": "The authorization-code flow separates user interaction at the authorization server from access-token delivery to the client. The client receives a short-lived authorization code and exchanges it for tokens. PKCE adds a verifier and derived challenge so the code exchange is bound to the initiating client instance; an intercepted code alone is not enough to redeem it. This is especially important for public clients that cannot safely keep a client secret, such as native apps. Redirect URI validation and state protection remain important. Use a current security profile and exact redirect URI handling. PKCE is not a replacement for validating token issuer, audience, expiry, or the user’s authorization to an API resource. Separate credential verification from the decision to allow a specific action on a specific resource. Apply least privilege and test denied cases, wrong audiences, stale permissions, and credential rotation. Keep tokens out of URLs and logs, and design revocation or expiry behavior explicitly.",
