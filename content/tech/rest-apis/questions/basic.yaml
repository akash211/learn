    "id": "api-basic-015",
    "topic": "pagination",
    "difficulty": "intermediate",
    "question": "Why must a cursor pagination sort include a unique tie-breaker?",
    "answer": "If results are sorted only by a non-unique field such as created_at, several records can share the cursor position. The next-page predicate may then skip tied items or return them again, depending on implementation. Add a unique stable key as the final sort component, and encode all relevant sort values in the cursor. The database ordering and cursor predicate must use the same direction and comparison rules. Cursor tokens should be opaque and bound to the query filters and sort order. Test equal primary sort keys, inserts, deletes, and reversed traversal. Re-check authorization for every page; a cursor is a position marker, not a permission grant. Test the exact ordering and boundary conditions at page transitions, including equal sort values and concurrent writes. Bound the amount of work per request and repeat authorization checks on every page. State whether traversal is a snapshot or only a best-effort view of a changing collection.",
