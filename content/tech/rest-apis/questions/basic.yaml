    "id": "api-basic-006",
    "topic": "http semantics",
    "difficulty": "intermediate",
    "question": "What is the purpose of 409 Conflict versus 412 Precondition Failed?",
    "answer": "409 reports a conflict with the current state of the target resource, such as attempting an invalid state transition or creating a duplicate unique name. 412 is specifically associated with a request precondition that evaluated false, commonly If-Match during an optimistic-concurrency update. Use 412 when the client explicitly says “apply this only if the representation is still revision X,” and 409 for a domain-level conflict not expressed by an HTTP precondition. Both can include a problem response explaining recovery. A client may fetch the current representation and reconcile rather than blindly retrying. Keeping the distinction lets generic clients recognize conditional-update failures while domain clients handle business conflicts. Avoid mapping every failed write to 500 or 400. In a design review, write the exact request and response pair and check what a generic HTTP client can infer without understanding your domain. Verify headers and body rules as well as the status. Consider retries after a lost response, because that is where semantic mistakes become duplicate writes.",
