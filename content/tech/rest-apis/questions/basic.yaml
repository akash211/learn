    "question": "What is the difference between Cache-Control no-cache and no-store?",
    "answer": "`no-store` tells caches not to store the response. `no-cache` allows storage but requires successful validation before reuse. The names are easy to confuse. `private` prevents shared caches from storing a response as shared content while allowing a private cache to store it; `public` can permit shared caching when other rules allow. These directives are policy signals, not a complete data-loss prevention mechanism: they do not erase logs or copies already saved by clients. Choose based on sensitivity, audience, and acceptable staleness. For personalized content, explicitly consider shared-cache behavior and credentials. Verify the deployed CDN and browser policy rather than assuming a framework setting reaches every cache. Check behavior at the actual shared and private caches, including freshness, validators, variant selection, and personalized data. Cache directives are part of the security boundary. A correct origin response can still be unsafe if an intermediary reuses it for the wrong audience.",
