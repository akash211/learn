    "id": "api-basic-023",
    "topic": "tokens",
    "difficulty": "intermediate",
    "question": "What must a resource server check before trusting a JWT?",
    "answer": "A resource server must verify the JWT signature using a trusted key and allowed algorithm, then validate claims relevant to its policy: issuer, audience, expiry, not-before when present, and any required scopes or roles. It should not accept a token merely because the payload decodes, nor fetch a key from an arbitrary URL supplied by untrusted input. Key rotation, clock skew, and revocation strategy must be considered. JWT is a token format, not an encryption guarantee; signed claims are often readable by anyone holding the token. Restrict the accepted issuer and audience to the intended trust boundary. Never log bearer tokens, and test malformed, expired, wrong-audience, and wrong-signature tokens. Decoding is not verification: validate signature, trusted issuer, intended audience, lifetime, and the claims required by authorization policy. Use an explicit allowlist of algorithms and trusted keys, and redact bearer material from every observability pipeline.",
