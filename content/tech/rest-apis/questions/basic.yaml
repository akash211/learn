    "id": "api-basic-024",
    "topic": "api contracts",
    "difficulty": "intermediate",
    "question": "What does OpenAPI describe, and what does it not guarantee?",
    "answer": "OpenAPI is a language-agnostic description of an HTTP API’s paths, operations, parameters, schemas, responses, and security mechanisms. Tools can use it for documentation, client generation, validation, and tests. The document itself does not enforce security, validate runtime requests, or guarantee implementation conformance. A syntactically valid schema can still omit important headers or describe incorrect behavior. Keep one source of truth where possible and check actual service behavior against the published contract in CI or staging. Include status codes, error schemas, pagination, conditional headers, and authentication per operation. Contract tests should cover failures and runtime semantics, not just compare a response body to a schema. An interface description is useful only when the running service and clients are checked against it. Include headers, errors, security, and pagination, then run schema and integration checks in CI. Review actual SDK behavior because syntax-valid contracts can still break deployed consumers.",
