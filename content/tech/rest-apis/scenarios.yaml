    "id": "api-scn-001",
    "title": "Duplicate payment after a client timeout",
    "technologies": [
      "rest-apis",
      "fastapi",
      "python"
    ],
    "difficulty": "advanced",
    "prompt": "A checkout client sends POST /payments and receives no response before its timeout. The processor dashboard shows a charge, but the API returned nothing. The client retries with a new request and a second charge appears. Design a safe remediation and the API behavior for future requests.",
    "approach": "First establish whether the original request committed and reconcile the duplicate through the payment provider; do not issue more retries blindly. Then define an idempotency-key contract scoped to the caller and operation, fingerprint the request, atomically reserve the key before the effect, and return the stored outcome for same-key retries. Reject changed payloads with a clear conflict. Include an in-progress state and define retention, expiry, and behavior when downstream outcome is unknown. Propagate one operation identifier downstream and expose a reconciliation or status path. Test simultaneous duplicate requests and a response lost after commit.",
    "red_flags": [
      "Assuming a timeout proves the server rolled back.",
      "Generating a fresh idempotency key on each retry.",
      "Saving the key only after the charge, leaving a race.",
      "Claiming exactly-once execution across systems without a defined deduplication boundary."
    ]
  },
  {
    "id": "api-scn-002",
    "title": "Concurrent edits overwrite a newer representation",
    "technologies": [
      "rest-apis",
      "python"
    ],
    "difficulty": "intermediate",
    "prompt": "Two administrators GET the same customer profile. Each edits a different field. The second PUT silently replaces the first administrator’s update because it submits a complete stale representation. Users report disappearing changes but no server errors. Explain how to prevent lost updates and what clients should do after a conflict.",
    "approach": "Introduce a strong ETag for each selected representation and require If-Match on updates, or use an equivalent explicit revision token. The server checks the precondition before applying the mutation and returns 412 when the representation has changed. The client fetches the current state, reconciles its intended edit, and submits against the new validator. If a domain conflict is not an HTTP precondition, use a documented 409 instead. Test concurrent updates, missing validators, and a request whose successful response is lost. Keep validator generation consistent with representation changes.",
    "red_flags": [
      "Using a weak validator where strong comparison is needed.",
      "Blindly retrying the stale PUT.",
      "Returning success while discarding a concurrent edit.",
      "Confusing 409 business conflicts with 412 failed preconditions."
    ]
  },
  {
    "id": "api-scn-003",
    "title": "Cursor pages omit records during a busy feed",
    "technologies": [
      "rest-apis",
      "python"
    ],
    "difficulty": "intermediate",
    "prompt": "A mobile app loads a descending activity feed using a cursor based only on created_at. Many events share a timestamp. During active traffic, some users see duplicates and others never see several events. The database team proposes adding a random cursor string. Diagnose the problem and outline a robust page contract.",
    "approach": "The cursor key is not unique, so rows tied at the boundary cannot be ordered and resumed deterministically. Sort by created_at plus a unique stable ID, encode both values and sort direction into an opaque cursor, and make the query predicate match the ordering exactly. Bind cursor to filter/sort parameters and version its encoding. Recheck authorization on each page. Document whether inserts during traversal can appear and whether this is a snapshot. Verify index support for the filter/order combination; randomizing a cursor token does not fix ordering.",
    "red_flags": [
      "Adding randomness without a consistent continuation predicate.",
      "Relying on database default order for equal timestamps.",
      "Treating a cursor as authorization or assuming it guarantees a snapshot.",
      "Failing to test equal sort keys and concurrent inserts."
    ]
  },
