    ],
    "difficulty": "advanced",
    "prompt": "A service validates JWT signatures and checks for the `reports:read` scope. A customer discovers that changing `/tenants/acme/reports` to `/tenants/other/reports` returns another tenant’s data. Tokens are correctly signed, have not expired, and were issued by the company identity provider. Find the security gap and propose verification tests.",
    "approach": "The token proves a trusted issuer granted a capability, not permission for every tenant ID. Validate issuer, audience, expiration, allowed algorithms, and scope, then perform object/tenant-level authorization for the requested tenant on every route and nested resource. Derive tenant membership from trusted claims or an authorization service rather than a caller-controlled filter. Apply the policy to list, item, expansion, and export endpoints. Return 403 or a deliberate non-disclosing 404 consistently. Add cross-tenant negative tests and audit decisions without logging the bearer token.",
    "red_flags": [
      "Treating a valid signature as sufficient authorization.",
      "Trusting the tenant path or query parameter as proof of membership.",
      "Relying on unguessable IDs as access control.",
      "Logging the token while investigating the incident."
    ]
