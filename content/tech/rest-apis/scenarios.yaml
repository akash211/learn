    ],
    "difficulty": "intermediate",
    "prompt": "Application routes return RFC 9457 problem details, but oversized bodies and upstream timeouts are generated by a gateway as HTML. The mobile SDK expects JSON and crashes while parsing a timeout. Support cannot correlate a gateway failure with logs. Design a contract and rollout approach across layers.",
    "approach": "Inventory errors by layer and decide which component owns each status and body. Configure the gateway to emit a safe, documented problem+json shape where feasible, preserve accurate statuses, and include an opaque correlation identifier that is queryable in protected telemetry. Do not forward raw upstream internals. Update OpenAPI and SDK error handling to accept documented problems and a defensive fallback for nonconforming intermediaries. Add integration tests through the gateway for request-size rejection, upstream timeout, and application validation. Roll out with telemetry on old clients and coordinate SDK migration.",
    "red_flags": [
      "Mapping all gateway failures to 200 or 500 without meaning.",
      "Exposing stack traces or upstream hostnames.",
      "Assuming application unit tests cover edge-generated responses.",
      "Changing the error schema without testing deployed SDKs."
