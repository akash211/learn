  {
    "id": "api-scn-006",
    "title": "Service-wide latency rises after adding a BFF fan-out",
    "technologies": [
      "rest-apis",
      "fastapi",
      "python"
    ],
    "difficulty": "advanced",
    "prompt": "A new mobile BFF combines four downstream APIs in parallel. Its own route has a one-second timeout, but request latency rises across the cluster, worker pools saturate, and retries double traffic during a partial outage. Product asks to increase the timeout and retry every failure. Propose a resilience and observability plan.",
    "approach": "Measure per-dependency latency, queue wait, retries, and worker saturation before adjusting timeouts. Give each call a bounded deadline within an end-to-end budget, cap concurrency and queue depth, and retry only transient failures within a shared attempt/deadline budget using backoff and jitter. Add circuit breaking or admission control for persistently failing dependencies. Decide which fan-out results are mandatory and whether optional data can be omitted explicitly. Emit route-template metrics and trace IDs without high-cardinality user labels or secrets. Test slow and unavailable dependencies, and keep liveness independent of downstream health.",
    "red_flags": [
      "Increasing timeouts without resource or deadline analysis.",
      "Retrying permanent 4xx failures or multiplying retries at every layer.",
      "Logging tokens and full payloads to obtain traces.",
      "Letting optional enrichment block critical responses indefinitely."
    ]
  }
