      "timescaledb",
      "columnstore-regression"
    ]
  },
  {
    "id": "tsdb-recent-006",
    "topic": "late arrival",
    "difficulty": "intermediate",
    "question": "How should refresh and compression policies account for late-arriving events?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Measure event lateness and set a mutable window covering normal corrections. Continuous aggregate `start_offset` must reach late data; `end_offset` should allow buckets to settle. Compression should wait until writes are sufficiently rare. For older corrections, define quarantine or a controlled, version-supported update and refresh path. Monitor job failures and freshness, and test the ordering of refresh, compression, and retention. No single offset works for every arrival distribution. Use observed lateness percentiles and the business correction window to choose refresh offsets, then ensure compression occurs only after data is expected to settle. For example, if corrections can arrive 24 hours late, a two-hour refresh window will leave aggregate values stale unless a deliberate backfill process exists. Monitor job failures, refresh lag, and correction age, and test what happens when a late update targets a compressed chunk. Document the supported repair procedure for old data and its cost.",
    "tags": [
      "timescaledb",
      "late-arrival"
    ]
  },
  {
    "id": "tsdb-recent-007",
    "topic": "archive gate",
    "difficulty": "intermediate",
    "question": "How can retention avoid removing data before its archive is usable?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Make verified archive completion a prerequisite to destructive retention. Export bounded ranges, validate counts or checksums, and read objects back. Keep a manifest with schema version, range, timezone conventions, and export time. Mark a range complete only after validation. Retention runs asynchronously and chunk boundaries are coarse, so monitor actual candidates and job outcomes. Retries must be idempotent. An upload success response alone does not prove that an archive can be restored or interpreted. A concrete archive gate is to export one bounded range, record its schema and time zone conventions in a manifest, verify counts or checksums, then read the object back before marking it complete. Only completed ranges should be eligible for retention. Because retention removes whole chunks asynchronously, alert on failed exports and review the actual chunks selected by the policy. Make retries safe and ensure the archive can be restored after schema changes. An upload response confirms transport, not content integrity or future interpretability.",
    "tags": [
      "timescaledb",
      "archive-gate"
    ]
  },
  {
    "id": "tsdb-recent-008",
    "topic": "COPY retries",
    "difficulty": "intermediate",
    "question": "What is a robust high-volume ingestion path when events can be retried?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Batch rows through `COPY` or multi-row inserts, keeping transactions and client buffers bounded. Define stable event identity and a unique constraint satisfying hypertable partition requirements. A retry after a lost acknowledgement can then deduplicate or apply a defined correction via `ON CONFLICT`. For complex validation, COPY into staging and quarantine invalid rows. Commit broker offsets only after database durability. Monitor queue depth, latency, conflicts, WAL, and replica lag; apply backpressure rather than allowing unbounded buffers. Stable event IDs make retries idempotent after an ambiguous commit, while bounded batches prevent a slow database from exhausting client memory. For example, replaying a broker batch after losing its acknowledgment should not create duplicate measurements or move offsets ahead of durable data. COPY into staging is useful when rows require validation or quarantine before merge. Monitor WAL, conflicts, queue depth, and replica lag; apply backpressure when these rise. Verify hypertable unique constraints include the required partition dimensions.",
    "tags": [
      "timescaledb",
      "COPY-retries"
    ]
  },
  {
    "id": "tsdb-recent-009",
    "topic": "retention precision",
    "difficulty": "intermediate",
    "question": "A product requires retaining every row for exactly 90 days. Is chunk retention sufficient?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Not necessarily. Policies usually remove whole chunks, with eligibility and job cadence constrained by chunk boundaries. A chunk overlapping the 90-day boundary can remain longer. Choose an interval compatible with acceptable over-retention and verify installed semantics. If deletion must occur at per-row precision, chunk drops alone are insufficient; row deletes or smaller boundaries may be required, with WAL and vacuum costs. Clarify whether the requirement is a minimum period, maximum period, or exact expiry, and inspect candidates before policy activation. First translate “exactly 90 days” into an explicit maximum age and acceptable delay, then calculate how chunk length and retention-job cadence affect the oldest surviving rows. For example, weekly chunks may retain data almost a week beyond a row's 90-day mark. Shorter chunks reduce that granularity but increase chunk-management overhead. If the rule requires precise row-level expiry, per-row deletion can create substantial WAL and vacuum work; consider whether the requirement is actually a minimum retention interval instead.",
    "tags": [
      "timescaledb",
      "retention-precision"
    ]
  },
  {
    "id": "tsdb-recent-010",
    "topic": "rollup math",
    "difficulty": "intermediate",
    "question": "A daily dashboard needs a weighted mean from hourly aggregates. What should the hourly view store?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Store hourly sum and count of non-null measurements, then compute daily mean as total sum divided by total count. Averaging hourly averages gives each hour equal weight despite different sample counts. Preserve min/max if needed; those combine across hours. For variance, percentiles, or distinct counts, a final scalar may not support correct higher-level rollups. Use mergeable state or retain raw data. Define null handling and timezone-aware day boundaries, then compare daily output with raw calculations over irregular sampling. Suppose one hour has a single reading while another has many; averaging the two hourly means weights each hour equally and is not the mean of all observations. Store sum and non-null count so a higher-level aggregate can combine them correctly. Define the reporting timezone and treatment of null or empty buckets, especially across daylight-saving changes. Min and max can also be rolled up, but variance and percentiles need appropriate mergeable state or raw observations.",
    "tags": [
      "timescaledb",
      "rollup-math"
    ]
  },
  {
    "id": "tsdb-recent-011",
    "topic": "PITR",
    "difficulty": "advanced",
    "question": "Which backup method supports PITR, and what extension checks are needed?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "PITR generally requires a physical base backup and complete WAL archive through the target time. `pg_dump` is useful for logical portability and selective restore, but is not PITR by itself. Restored PostgreSQL and TimescaleDB library/catalog versions must be compatible. Install the correct extension package and configuration before accepting traffic, following release-specific restore guidance. Test a restore to a point before a known change and query hypertables, compressed data, aggregates, and jobs. A successful backup command alone does not prove recoverability. Practice recovery to a timestamp just before a known change, then verify both ordinary and Timescale-specific objects and background behavior before opening the restored database to users. For example, check that compressed chunks can be queried, continuous aggregates return expected values, and jobs are configured as intended. Confirm WAL continuity, encryption-key access, matching extension libraries, and restore ordering for the exact release. A logical dump may help move selected objects but cannot replay the server's WAL timeline for PITR.",
