  {
    "id": "tsdb-recent-003",
    "topic": "PostgreSQL compatibility",
    "difficulty": "advanced",
    "question": "How do you evaluate TimescaleDB compatibility when upgrading PostgreSQL major versions?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Use the compatibility matrix for the exact TimescaleDB and PostgreSQL versions, then review release notes and supported sequences. Extension binaries must be compatible on primary, standby, and restore hosts. PostgreSQL major upgrades and `ALTER EXTENSION ... UPDATE` are separate procedures and may have required ordering. Test the sequence on a recent clone, including migration method, jobs, compressed chunks, continuous aggregates, replication, failover, and restore. Managed platforms can constrain packages and timing. Do not infer support because the server starts. A rehearsal should restore or clone the production topology and execute the documented sequence end to end, not merely test a single server. Verify extension libraries on every replica and restore host, plus background jobs, compressed chunk reads, continuous aggregate refresh, and failover. For example, a primary may start successfully while a standby lacks the matching extension package and cannot follow or promote correctly. Record the PostgreSQL and extension versions at each step, and test a point-in-time restore after the change.",
