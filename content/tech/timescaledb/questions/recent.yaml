    "id": "tsdb-recent-004",
    "topic": "skip scan",
    "difficulty": "advanced",
    "question": "Can PostgreSQL skip scan make an index on tenant_id, time efficient for time-only filters?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Possibly on some newer PostgreSQL versions and distributions, but it is not a general substitute for an index beginning with time. Usefulness depends on distinct values of the leading key, statistics, selectivity, and planner costs. A high-cardinality tenant key can make repeated probing expensive. TimescaleDB compatibility also matters. Run `EXPLAIN (ANALYZE, BUFFERS)` with representative parameters and compare a time-leading index. Chunk pruning can reduce relations but does not guarantee efficient access inside each surviving chunk. Use EXPLAIN ANALYZE with representative tenant counts and time ranges, and inspect actual loops and buffer reads for the skip-scan path. A low number of distinct tenants might make repeated probes reasonable, while a large number can make the same plan expensive. Compare against an index led by time and include the write and storage cost of maintaining it. Timescale chunk pruning can eliminate irrelevant chunks but still leave each chunk with an inefficient index access pattern.",
    "tags": [
      "timescaledb",
      "skip-scan"
    ]
