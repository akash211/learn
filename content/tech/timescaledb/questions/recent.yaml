  {
    "id": "tsdb-recent-002",
    "topic": "real-time aggregates",
    "difficulty": "intermediate",
    "question": "What should you verify when an upgrade changes continuous aggregate real-time behavior?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Verify the view configuration and semantics instead of relying on remembered defaults. Real-time aggregation can combine materialized history with raw rows newer than the watermark, but defaults changed across releases. Inspect the version-specific setting, query both historical and newest intervals, and compare with raw source data. Check the plan and latency: the raw tail improves freshness but adds work. Confirm refresh offsets and job status so a missing boundary is not mistaken for an upgrade bug. Add a regression test before and after the upgrade. A useful regression fixture includes late-arriving data in a recent bucket and a bucket whose refresh boundary has just moved. Compare the continuous aggregate with a direct query over raw rows and confirm the watermark does not create a gap or double count. For example, a dashboard may need new events visible immediately while older buckets remain materialized. Inspect the plan and measure the extra raw-tail work under concurrent dashboard requests.",
