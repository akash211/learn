  {
    "id": "tsdb-recent-005",
    "topic": "columnstore regression",
    "difficulty": "advanced",
    "question": "A historical query slows after adding a segment key. What should be investigated?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Check whether the segment key matches selective filters and whether it creates many tiny groups. High cardinality can increase metadata and reduce compression. Compare compressed size and plans with the previous layout, testing queries with and without the segment predicate. Check time ordering, selected columns, chunk pruning, and whether the query is a point lookup rather than an analytical scan. Columnar storage helps when it can skip groups or avoid unused columns; it is not universally faster. Reproduce on the exact extension version. A high-cardinality segment such as a nearly unique request identifier can split data into many tiny groups and undermine compression or skip efficiency. A lower-cardinality attribute that frequently appears in filters may be useful. For example, compare device-type queries with session-specific point lookups and broad time scans on the same sample chunks. Record compressed size, query latency, and I/O, and inspect whether the segment predicate actually prunes groups.",
