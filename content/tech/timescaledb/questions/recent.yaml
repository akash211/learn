    "id": "tsdb-recent-001",
    "topic": "columnstore migration",
    "difficulty": "intermediate",
    "question": "How should a team migrate from legacy compression settings to newer columnstore APIs?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Treat this as a versioned migration, not a search-and-replace. Identify installed PostgreSQL and extension versions, review the supported path, and test on a restored clone. Older releases commonly use `timescaledb.compress`, `compress_orderby`, `compress_segmentby`, and `add_compression_policy`; newer releases may expose Hypercore or columnstore APIs. Names and supported operations vary. Inventory chunks and policies, test conversion and query results on a representative chunk, and confirm job status. A catalog update does not prove historical chunks migrated. A safe rehearsal should include policy and job behavior as well as query results. For example, verify that a representative historical chunk is actually converted, that its data remains queryable, and that jobs do not leave chunks in an unexpected state. Check the installed extension version before using a command from a newer documentation page. Measure storage and ingestion impact, and plan how to handle chunks that are already compressed under legacy settings. Keep the original clone and a tested recovery route until conversion succeeds.",
