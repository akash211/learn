  {
    "id": "tsdb-recent-012",
    "topic": "system choice",
    "difficulty": "intermediate",
    "question": "When should a time-series workload move from TimescaleDB to a columnar store?",
    "period": "2024-2026",
    "type": "representative",
    "answer": "Consider columnar storage when broad scans over huge history, high-cardinality grouping, and concurrent analytics dominate, especially if OLTP integration is secondary. Benchmark real data and concurrency. TimescaleDB can remain useful for recent transactions, relational joins, and operational queries. A hybrid system may export older data, but must define delay, schema evolution, corrections, access control, and reconciliation. Moving engines shifts lifecycle work to data movement. Plain PostgreSQL may be sufficient when native partitioning and indexes already meet modest needs. Benchmark scans, grouping, ingestion, freshness, and concurrency using representative historical data before selecting a new engine. A hybrid design can keep operational recent data in TimescaleDB and move older data to columnar storage, but queries spanning the boundary need consistent schemas and reconciliation. For example, late corrections to archived months require a defined re-export or correction path. Include data movement, retention, access control, backup, and restore in total cost.",
