{
  "concepts": [
    {
      "title": "Expected hash lookup",
      "detail": "Dict/set lookup is expected O(1); hashing a string costs with its length and worst-case collisions can degrade performance."
    },
    {
      "title": "Amortized list append",
      "detail": "Occasional resizing costs O(n), but a sequence of appends is amortized O(1) each."
    },
    {
      "title": "Half-open intervals",
      "detail": "For [l,r), length is r-l and prefix sums give sum = prefix[r]-prefix[l]."
    },
    {
      "title": "Prefix-sum frequency",
      "detail": "Count earlier prefix values p-k to count subarrays ending now with sum k; seed frequency[0]=1."
    },
    {
      "title": "Window invariant",
      "detail": "Update the entering item, restore validity, then update the answer; each boundary should move monotonically."
    },
    {
      "title": "Monotonic stack",
      "detail": "Each index is pushed and popped at most once, yielding O(n) total work for next-greater patterns."
    },
    {
      "title": "Deque for FIFO",
      "detail": "collections.deque popleft is O(1); list.pop(0) shifts remaining references."
    },
    {
      "title": "Tree recursion space",
      "detail": "Recursive tree routines use O(h) call frames; a skewed tree has h=O(n)."
    },
    {
      "title": "BFS shortest paths",
      "detail": "BFS first discovers a shortest path in an unweighted graph when vertices are marked on enqueue."
    },
    {
      "title": "Graph traversal bound",
      "detail": "Adjacency-list DFS/BFS is O(V+E), including disconnected vertices only if all components are started."
    },
    {
      "title": "Topological cycle test",
      "detail": "Kahn emits fewer than V vertices exactly when a directed cycle remains."
    },
    {
      "title": "Union-find",
      "detail": "Path compression plus union by size gives amortized O(alpha(V)) operations for connectivity."
    },
    {
      "title": "Heap order",
      "detail": "A heap exposes its root minimum; it is not globally sorted. Push/pop O(log n), heapify O(n)."
    },
    {
      "title": "DP state definition",
      "detail": "Define what dp[i] or dp[i][j] means before stating base cases and transitions."
    },
    {
      "title": "Backtracking copy",
      "detail": "Append path.copy() to results; retaining the mutable path aliases future changes."
    },
    {
      "title": "Binary-search boundary",
      "detail": "Maintain a monotone false/true predicate boundary and ensure every branch strictly shrinks the interval."
    }
