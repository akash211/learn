- id: dsa-recent-001
  topic: top-k
  difficulty: intermediate
  question: Keep the k most frequent values from a large array; ties may be arbitrary.
  answer: "Approach: Count values and use a bounded min-heap over frequencies.\n\nWhy it works: Counting separates frequency computation from selection, and the heap-based utility avoids fully sorting every distinct value.\n\nWorked example: For [1,1,1,2,2,3] and k=2, return 1 and 2. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n + u log(min(k, u))) for k>0; space O(u), for u distinct values.\n\n```python\nfrom collections import Counter\nimport heapq\ndef top_k(nums, k):\n    return [x for x,_ in heapq.nlargest(k, Counter(nums).items(), key=lambda p:p[1])]\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
