- id: dsa-recent-010
  topic: trie
  difficulty: intermediate
  question: Implement a trie with insert, exact search, and prefix search.
  answer: "Approach: Each node maps characters to child nodes and carries an end-of-word marker.\n\nWhy it works: Shared prefixes reuse trie nodes, while the end marker distinguishes a complete word from a prefix.\n\nWorked example: Insert \"cat\": search(\"cat\") is true but search(\"ca\") is false and starts_with(\"ca\") is true. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: O(L) per operation for word length L; space O(total inserted characters).\n\n```python\nclass TrieNode:\n    def __init__(self): self.children={}; self.end=False\nclass Trie:\n    def __init__(self): self.root=TrieNode()\n    def insert(self, word):\n        node=self.root\n        for ch in word: node=node.children.setdefault(ch,TrieNode())\n        node.end=True\n    def _walk(self, text):\n        node=self.root\n        for ch in text:\n            if ch not in node.children: return None\n            node=node.children[ch]\n        return node\n    def search(self, word):\n\
    \        node=self._walk(word); return node is not None and node.end\n    def starts_with(self, prefix): return self._walk(prefix) is not None\n```"
  tags:
  - trie
  period: 2024-2026
