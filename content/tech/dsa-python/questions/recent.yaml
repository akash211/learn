- id: dsa-recent-002
  topic: intervals
  difficulty: intermediate
  question: Merge a list of possibly overlapping meeting intervals.
  answer: "Approach: Sort by start and extend the active output interval while ranges overlap.\n\nWhy it works: Sorting makes starts nondecreasing, so only the active last interval can overlap the next interval.\n\nWorked example: [[1,3],[2,6],[8,10]] merges to [[1,6],[8,10]]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n log n); space O(n) output.\n\n```python\ndef merge(intervals):\n    out=[]\n    for s,e in sorted(intervals):\n        if not out or s>out[-1][1]: out.append([s,e])\n        else: out[-1][1]=max(out[-1][1],e)\n    return out\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
