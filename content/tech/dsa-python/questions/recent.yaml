- id: dsa-recent-007
  topic: sliding window
  difficulty: advanced
  question: Count subarrays containing exactly k distinct integers.
  answer: "Approach: Compute atMost(k)-atMost(k-1) with a frequency-map sliding window.\n\nWhy it works: At-most counts include every valid suffix ending at each right boundary; subtracting adjacent limits isolates exactly-k windows.\n\nWorked example: [1,2,1,2,3] with k=2 returns 7. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n) expected; space O(n).\n\n```python\nfrom collections import defaultdict\ndef subarrays_exactly_k(a,k):\n    def at_most(limit):\n        if limit<0: return 0\n        count=defaultdict(int); left=total=0\n        for right,x in enumerate(a):\n            if count[x]==0: limit-=1\n            count[x]+=1\n            while limit<0:\n                y=a[left]; count[y]-=1; left+=1\n                if count[y]==0: limit+=1\n            total+=right-left+1\n        return total\n    return at_most(k)-at_most(k-1)\n``` The sliding window counts every valid start for each right endpoint, because any start at or after the maintained left boundary still has at most the allowed number of distinct values. Subtracting the at-most counts isolates windows with exactly k. For [1,2,1,2,3] and k=2, the result is 7. A negative limit returns zero, so k=0 is handled consistently by the difference."
  tags:
  - sliding-window
  period: 2024-2026
