- id: dsa-recent-008
  topic: matrix
  difficulty: intermediate
  question: Return all elements of a rectangular matrix in clockwise spiral order.
  answer: "Approach: Shrink top, bottom, left, and right boundaries after each directed edge traversal.\n\nWhy it works: After each edge, shrinking the corresponding boundary prevents revisiting cells on the next inner spiral.\n\nWorked example: [[1,2,3],[4,5,6]] traverses [1,2,3,6,5,4]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(RC); output space O(RC).\n\n```python\ndef spiral_order(matrix):\n    if not matrix or not matrix[0]: return []\n    top,bottom,left,right=0,len(matrix)-1,0,len(matrix[0])-1; out=[]\n    while top<=bottom and left<=right:\n        out.extend(matrix[top][left:right+1]); top+=1\n        for r in range(top,bottom+1): out.append(matrix[r][right])\n        right-=1\n        if top<=bottom:\n            out.extend(reversed(matrix[bottom][left:right+1])); bottom-=1\n        if left<=right:\n            for r in range(bottom,top-1,-1): out.append(matrix[r][left])\n            left+=1\n    return out\n``` Shrinking a boundary immediately after traversing its edge prevents that edge from appearing in the next inner layer. The conditional checks matter when only one row or column remains; without them, a thin matrix can be emitted twice. For example, after the top row of a one-row matrix is visited, no bottom-row traversal should repeat it."
