- id: dsa-recent-003
  topic: cache
  difficulty: intermediate
  question: Implement an LRU cache with O(1) average get and put.
  answer: "Approach: OrderedDict keeps least-recent first; move hits/updates to the end and evict from the front.\n\nWhy it works: Moving a hit or update to the end records recency; removing the first item therefore evicts the least recently used key.\n\nWorked example: With capacity 2, get(a) after inserting a,b makes b the eviction candidate. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Average O(1) per operation; space O(capacity).\n\n```python\nfrom collections import OrderedDict\nclass LRUCache:\n    def __init__(self, capacity): self.cap=capacity; self.data=OrderedDict()\n    def get(self, key):\n        if key not in self.data: return -1\n        self.data.move_to_end(key); return self.data[key]\n    def put(self, key, value):\n        if self.cap<=0: return\n        if key in self.data: self.data.move_to_end(key)\n        self.data[key]=value\n        if len(self.data)>self.cap: self.data.popitem(last=False)\n```"
