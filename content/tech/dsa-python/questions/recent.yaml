- id: dsa-recent-011
  topic: DP on strings
  difficulty: intermediate
  question: Determine whether a string can be segmented into dictionary words.
  answer: "Approach: Let dp[i] mark segmentability of prefix s[:i]; extend from reachable cut points.\n\nWhy it works: Each true prefix endpoint can extend by a dictionary word; bounded start positions avoid checking impossible longer words.\n\nWorked example: \"leetcode\" with [\"leet\",\"code\"] is segmentable. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(nL²) with maximum word length L (O(n³) worst case) because slicing and hashing substrings cost O(L); space O(n + dictionary size), excluding temporary slices.\n\n```python\ndef word_break(s, words):\n    words=set(words); dp=[False]*(len(s)+1); dp[0]=True\n    maxlen=max(map(len,words),default=0)\n    for end in range(1,len(s)+1):\n        for start in range(max(0,end-maxlen),end):\n            if dp[start] and s[start:end] in words: dp[end]=True; break\n    return dp[-1]\n```"
