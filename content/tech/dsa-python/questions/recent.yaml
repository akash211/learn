- id: dsa-recent-004
  topic: rate limiting
  difficulty: intermediate
  question: Implement a token bucket with positive capacity and refill rate, permitting bursts up to capacity.
  answer: "Approach: Refill by elapsed time up to capacity, then atomically consume cost if enough tokens exist. This in-memory version assumes serialized calls.\n\nWhy it works: Refill is proportional to elapsed time and capped at capacity; consuming only after the balance check prevents negative state.\n\nWorked example: Capacity 5, refill 1 token/second: after spending one, waiting two seconds restores two tokens. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: O(1) time and O(1) space per bucket.\n\n```python\nclass TokenBucket:\n    def __init__(self, capacity, refill_per_second):\n        self.capacity=capacity; self.rate=refill_per_second; self.tokens=float(capacity); self.updated=None\n    def allow(self, now, cost=1):\n        if cost<0 or cost>self.capacity: return False\n        if self.updated is None: self.updated=now\n        elapsed=max(0.0, now-self.updated)\n        self.tokens=min(self.capacity, self.tokens+elapsed*self.rate)\n \
    \       self.updated=max(self.updated,now)\n        if self.tokens<cost: return False\n        self.tokens-=cost; return True\n```"
