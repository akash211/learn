- id: dsa-recent-006
  topic: sliding window
  difficulty: advanced
  question: Find the shortest substring of s containing every character of t with multiplicity.
  answer: "Approach: Expand until all required counts are covered, then shrink while valid and retain the shortest range.\n\nWhy it works: The missing count tracks required multiplicity, so a window is shrunk only while it still covers every required character.\n\nWorked example: s=\"ADOBECODEBANC\", t=\"ABC\" returns \"BANC\". This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(|s|+|t|) expected; space O(u).\n\n```python\nfrom collections import Counter\ndef min_window(s,t):\n    if not t or not s: return \"\"\n    need=Counter(t); missing=len(t); left=0; best=(0,float(\"inf\"))\n    for right,ch in enumerate(s):\n        if need[ch]>0: missing-=1\n        need[ch]-=1\n        while missing==0:\n            if right-left+1<best[1]-best[0]: best=(left,right+1)\n            c=s[left]; need[c]+=1; left+=1\n            if need[c]>0: missing+=1\n    return s[best[0]:best[1]] if best[1]!=float(\"inf\") else \"\"\n```"
