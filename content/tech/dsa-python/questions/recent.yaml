- id: dsa-recent-012
  topic: DP on strings
  difficulty: intermediate
  question: Compute Levenshtein edit distance between two strings.
  answer: "Approach: Use rolling DP rows for insert, delete, and replace transitions; put shorter string on columns.\n\nWhy it works: Each cell chooses match, insertion, deletion, or replacement based on the neighboring prefix states.\n\nWorked example: Edit distance between \"horse\" and \"ros\" is 3. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(mn); space O(min(m,n)).\n\n```python\ndef edit_distance(a,b):\n    if len(b)>len(a): a,b=b,a\n    prev=list(range(len(b)+1))\n    for i,x in enumerate(a,1):\n        cur=[i]+[0]*len(b)\n        for j,y in enumerate(b,1):\n            cur[j]=prev[j-1] if x==y else 1+min(prev[j],cur[j-1],prev[j-1])\n        prev=cur\n    return prev[-1]\n``` The base row and column encode the costs of creating a prefix from an empty string, so empty inputs naturally produce the other string's length. Each edit changes one character, and the recurrence considers insertion, deletion, or substitution; matching characters need no extra cost. For example, transforming horse into ros takes three edits. Rolling rows saves memory but not time, which remains proportional to the product of the lengths."
  tags:
  - DP-on-strings
  period: 2024-2026
  type: representative
- id: dsa-recent-013
  topic: DP on strings
  difficulty: intermediate
  question: Find the length of the longest common subsequence of two strings.
  answer: "Approach: Use a prefix DP; matching characters extend the diagonal, otherwise take the better neighboring state.\n\nWhy it works: Matching characters extend the diagonal; otherwise the best subsequence excludes one of the two final characters.\n\nWorked example: LCS(\"abcde\",\"ace\") has length 3. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(mn); space O(min(m,n)).\n\n```python\ndef lcs_length(a,b):\n    if len(b)>len(a): a,b=b,a\n    dp=[0]*(len(b)+1)\n    for x in a:\n        prev=0\n        for j,y in enumerate(b,1):\n            old=dp[j]\n            if x==y: dp[j]=prev+1\n            else: dp[j]=max(dp[j],dp[j-1])\n            prev=old\n    return dp[-1]\n``` A subsequence preserves relative order but may skip intervening characters, which is why ace is a common subsequence of abcde and has length three. On a mismatch, either the best answer omits the current character from the first string or omits it from the second, so the recurrence takes the larger neighboring state. The one-row implementation saves the previous diagonal before overwriting a cell."
  tags:
  - DP-on-strings
  period: 2024-2026
