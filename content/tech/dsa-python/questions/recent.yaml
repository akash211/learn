- id: dsa-recent-005
  topic: sliding window
  difficulty: intermediate
  question: Return the maximum of every contiguous window of width k.
  answer: "Approach: Maintain a decreasing deque of indices; expire old indices and remove dominated values.\n\nWhy it works: Indices at the front are current maxima candidates; expired indices leave from front and dominated values from back.\n\nWorked example: [1,3,-1,-3,5,3,6,7], k=3 begins with maxima [3,3,5]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); space O(k).\n\n```python\nfrom collections import deque\ndef sliding_max(nums,k):\n    if k<=0 or k>len(nums): return []\n    q=deque(); out=[]\n    for i,x in enumerate(nums):\n        while q and q[0]<=i-k: q.popleft()\n        while q and nums[q[-1]]<=x: q.pop()\n        q.append(i)\n        if i>=k-1: out.append(nums[q[0]])\n    return out\n``` Each index enters and leaves the deque at most once, which is why the full scan is linear even though an iteration may pop several candidates. For example, in a decreasing sequence the front expires naturally, while a new large value can remove several smaller values from the back. These cases expose off-by-one expiration and confirm that values rather than indices are emitted."
