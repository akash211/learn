- id: dsa-recent-009
  topic: matrix
  difficulty: intermediate
  question: Rotate an n by n matrix clockwise in place.
  answer: "Approach: Transpose across the diagonal, then reverse each row.\n\nWhy it works: Transposition swaps row/column coordinates, then row reversal converts the reflected orientation into a clockwise turn.\n\nWorked example: [[1,2],[3,4]] becomes [[3,1],[4,2]]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n^2); space O(1).\n\n```python\ndef rotate_matrix(a):\n    n=len(a)\n    for i in range(n):\n        for j in range(i+1,n): a[i][j],a[j][i]=a[j][i],a[i][j]\n    for row in a: row.reverse()\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
