- id: dsa-recent-014
  topic: scheduling
  difficulty: intermediate
  question: Find the minimum CPU intervals needed to execute tasks with cooldown n.
  answer: "Approach: The most frequent task defines a lower bound; fill gaps of length n with other tasks or idle slots.\n\nWhy it works: The most frequent task fixes frame spacing; tied tasks occupy the final frame positions, while abundant other work fills idle gaps.\n\nWorked example: Tasks [A,A,A,B,B,B] with cooldown 2 need 8 intervals. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(m) to count m tasks; space O(u).\n\n```python\nfrom collections import Counter\ndef least_intervals(tasks,n):\n    if not tasks: return 0\n    counts=Counter(tasks); peak=max(counts.values())\n    tied=sum(v==peak for v in counts.values())\n    return max(len(tasks),(peak-1)*(n+1)+tied)\n``` The most frequent task dictates the minimum spacing; less frequent tasks can fill those gaps, reducing idle time until task count itself becomes the stronger lower bound. For example, three A tasks with cooldown two require at least seven intervals, while two equally frequent task types produce the tied-frequency formula."
  tags:
  - scheduling
  period: 2024-2026
  type: representative
