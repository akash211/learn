- id: dsa-basic-010
  topic: stack
  difficulty: beginner
  question: Determine whether brackets are valid and correctly nested.
  answer: "Approach: Push expected closers; each closing token must match the stack top.\n\nWhy it works: The stack top is the only opener that may legally close next, enforcing both pairing and nesting order.\n\nWorked example: \"([])\" is valid; \"([)]\" fails at the mismatched closer. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); space O(n).\n\n```python\ndef valid_brackets(s):\n    pairs = {\"(\": \")\", \"[\": \"]\", \"{\": \"}\"}; st = []\n    for ch in s:\n        if ch in pairs: st.append(pairs[ch])\n        elif not st or st.pop() != ch: return False\n    return not st\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
  tags:
