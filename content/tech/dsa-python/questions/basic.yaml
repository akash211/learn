- id: dsa-basic-009
  topic: intervals
  difficulty: intermediate
  question: Merge overlapping intervals.
  answer: "Approach: Sort by start and extend the last output interval whenever ranges overlap.\n\nWhy it works: After sorting by start, only the last output interval can overlap the next range; extending its end preserves a normalized prefix.\n\nWorked example: [[1,3],[2,6],[8,10]] becomes [[1,6],[8,10]]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n log n); space O(n) for output.\n\n```python\ndef merge_intervals(intervals):\n    out = []\n    for start, end in sorted(intervals):\n        if not out or start > out[-1][1]: out.append([start, end])\n        else: out[-1][1] = max(out[-1][1], end)\n    return out\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
