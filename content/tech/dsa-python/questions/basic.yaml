- id: dsa-basic-026
  topic: heap
  difficulty: intermediate
  question: Design a stream that returns the kth largest value after each insertion (assume k initial values exist).
  answer: "Approach: Keep a min-heap of the k largest seen; its root is the kth largest.\n\nWhy it works: The size-k heap keeps the largest seen values, so its minimum is exactly the kth-largest retained value.\n\nWorked example: With k=3 and initial [4,5,8,2], add 3 returns 4. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Add O(log k); query O(1); space O(k).\n\n```python\nimport heapq\nclass KthLargest:\n    def __init__(self, k, nums):\n        self.k = k; self.h = nums[:]; heapq.heapify(self.h)\n        while len(self.h) > k: heapq.heappop(self.h)\n    def add(self, val):\n        heapq.heappush(self.h, val)\n        if len(self.h) > self.k: heapq.heappop(self.h)\n        return self.h[0]\n``` Edge cases: fewer than k values at construction means the root is not yet the kth largest until enough adds arrive, so document that precondition. Duplicates count separately, which keeps ties well defined. Each add runs one sift over a fixed-size heap, hence O(log k), and the root answers in O(1). Retaining the whole stream costs O(n) space and wins only when k approaches n."
