- id: dsa-basic-030
  topic: graphs
  difficulty: intermediate
  question: Count islands in a rectangular character grid of land and water tokens using four-direction adjacency.
  answer: "Approach: Flood-fill each unseen land cell and mark cells when pushed.\n\nWhy it works: Marking each land cell when pushed ensures each cell is visited once and a component is not counted again.\n\nWorked example: A 2×2 grid [[1,1],[0,1]] contains one four-connected island. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(RC); auxiliary space O(RC) worst case.\n\n```python\ndef num_islands(grid):\n    if not grid: return 0\n    rows, cols=len(grid),len(grid[0]); count=0\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == \"1\":\n                count+=1; stack=[(r,c)]; grid[r][c]=\"0\"\n                while stack:\n                    i,j=stack.pop()\n                    for x,y in ((i+1,j),(i-1,j),(i,j+1),(i,j-1)):\n                        if 0<=x<rows and 0<=y<cols and grid[x][y]==\"1\":\n                            grid[x][y]=\"0\"; stack.append((x,y))\n    return count\n``` Edge cases: empty, ragged and all-water grids return 0, and marking on push is what stops two neighbours enqueuing the same cell in one wave. Each cell is inspected once as a start and at most once as a neighbour. Union-find wins when cells flip between land and water over time, since it answers connectivity without rescanning the grid."
  tags:
  - graphs
- id: dsa-basic-031
  topic: graphs
  difficulty: intermediate
  question: Flood-fill a 2D image from a starting cell with a new color.
  answer: "Approach: Use iterative DFS, replacing matching cells when discovered.\n\nWhy it works: Replacing a cell at discovery time prevents duplicate pushes while preserving the original-color test for neighbors.\n\nWorked example: Filling the center of [[1,1],[1,2]] with color 3 recolors only the connected 2-region. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(RC); auxiliary space O(RC) worst case.\n\n```python\ndef flood_fill(image, sr, sc, color):\n    old=image[sr][sc]\n    if old == color: return image\n    rows,cols=len(image),len(image[0]); stack=[(sr,sc)]; image[sr][sc]=color\n    while stack:\n        r,c=stack.pop()\n        for i,j in ((r+1,c),(r-1,c),(r,c+1),(r,c-1)):\n            if 0<=i<rows and 0<=j<cols and image[i][j]==old:\n                image[i][j]=color; stack.append((i,j))\n    return image\n``` Edge cases: a start cell already holding the new colour returns immediately, avoiding an infinite loop, and out-of-range coordinates should be rejected before indexing. Each cell enters the stack at most once, because the original-colour test fails on every later visit. A BFS with a deque has identical complexity and wins on wide, shallow regions where the frontier stays small."
  tags:
  - graphs
- id: dsa-basic-032
  topic: graphs
  difficulty: intermediate
  question: Return a deep copy of a connected graph from a start node.
  answer: "Approach: DFS with an original-to-copy map; create copies before exploring neighbors.\n\nWhy it works: Create and memoize each copy before visiting neighbors; this breaks cycles and preserves repeated references.\n\nWorked example: A node with a self-loop clones to a distinct node whose neighbor is itself. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(V+E); space O(V).\n\n```python\nclass Node:\n    def __init__(self, val=0, neighbors=None): self.val, self.neighbors = val, neighbors or []\ndef clone_graph(node):\n    if node is None: return None\n    copies={}\n    def dfs(x):\n        if x in copies: return copies[x]\n        y=Node(x.val); copies[x]=y\n        y.neighbors=[dfs(z) for z in x.neighbors]\n        return y\n    return dfs(node)\n``` Edge cases: an empty graph returns None, and a self-loop must point at the clone, which is exactly why the copy is registered before recursing. Each vertex is copied once and each edge followed from both ends, giving O(V+E). BFS over original nodes wins on deep graphs where DFS would overflow the recursion limit."
  tags:
  - graphs
- id: dsa-basic-033
  topic: graphs
  difficulty: intermediate
  question: Determine whether all courses can be completed given prerequisite pairs.
  answer: "Approach: Kahn topological sort; completion of fewer than all vertices indicates a cycle.\n\nWhy it works: If every vertex could be removed at indegree zero, the graph would be acyclic; leftover vertices therefore include a cycle.\n\nWorked example: A→B and B→A leave no complete topological ordering. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(V+E); space O(V+E).\n\n```python\nfrom collections import deque\ndef can_finish(n, prerequisites):\n    adj=[[] for _ in range(n)]; deg=[0]*n\n    for course, pre in prerequisites: adj[pre].append(course); deg[course]+=1\n    q=deque(i for i,d in enumerate(deg) if d==0); done=0\n    while q:\n        x=q.popleft(); done+=1\n        for y in adj[x]:\n            deg[y]-=1\n            if deg[y]==0: q.append(y)\n    return done==n\n``` Edge cases: duplicate prerequisite pairs inflate the indegree but still cancel correctly, and n=0 returns true with nothing to order. Each vertex is enqueued once and each edge relaxed once, hence O(V+E). DFS with a three-colour visiting state detects cycles without building an ordering and wins when you only need the yes/no answer, though it risks deep recursion."
  tags:
  - graphs
- id: dsa-basic-034
  topic: backtracking
  difficulty: intermediate
  question: Return all subsets of a list of distinct values.
  answer: "Approach: At each index, branch into excluding or including the current value.\n\nWhy it works: Each index is decided once as excluded or included, so every subset has one decision path.\n\nWorked example: For [a,b], the four results are [], [b], [a], [a,b]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time/output O(n 2^n); recursion space O(n), excluding output.\n\n```python\ndef subsets(nums):\n    out=[]; path=[]\n    def visit(i):\n        if i==len(nums): out.append(path.copy()); return\n        visit(i+1); path.append(nums[i]); visit(i+1); path.pop()\n    visit(0); return out\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
  tags:
  - backtracking
- id: dsa-basic-035
  topic: backtracking
  difficulty: intermediate
  question: Return unique combinations summing to target using positive candidates, each candidate reusable.
  answer: "Approach: Sort positive candidates and recurse from the chosen index; stop when a value exceeds the remainder.\n\nWhy it works: Sorted positive candidates permit stopping once a value exceeds the remainder; recursing at i allows reuse without permutation duplicates.\n\nWorked example: Candidates [2,3,6,7], target 7 yield [2,2,3] and [7]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Exponential output in worst case; recursion O(target/min_candidate) depth for positive candidates.\n\n```python\ndef combination_sum(candidates, target):\n    a=sorted(set(candidates)); out=[]; path=[]\n    def dfs(start, remain):\n        if remain==0: out.append(path.copy()); return\n        for i in range(start,len(a)):\n            x=a[i]\n            if x>remain: break\n            path.append(x); dfs(i,remain-x); path.pop()\n    dfs(0,target); return out\n``` Edge cases: the guarantee of positive candidates matters, since a zero would recurse forever because `x > remain` never fires. Sorting lets a single `break` discard the whole remaining suffix rather than one value. Recursing at i+1 enumerates without reuse and wins for the distinct-candidate variant; memoised DP over remainders wins when the same target is queried repeatedly."
  tags:
  - backtracking
- id: dsa-basic-036
  topic: dynamic programming
  difficulty: intermediate
  question: Find the minimum number of coins to make amount, or -1 if impossible.
  answer: "Approach: Bottom-up dp[a] stores minimum coins for amount a; relax every coin.\n\nWhy it works: Every optimal solution ends in some coin c, and dp[a-c] represents the best prefix before that final choice.\n\nWorked example: For coins [1,3,4], amount 6 takes two coins of 3. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(amount * number_of_coins); space O(amount).\n\n```python\ndef coin_change(coins, amount):\n    dp=[amount+1]*(amount+1); dp[0]=0\n    for a in range(1,amount+1):\n        for c in coins:\n            if c<=a: dp[a]=min(dp[a],dp[a-c]+1)\n    return -1 if dp[amount]>amount else dp[amount]\n```\n\nImplementation note: Check the empty and boundary cases, and confirm whether the routine mutates its input or excludes returned output from its auxiliary-space bound."
  tags:
  - dynamic-programming
