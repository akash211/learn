- id: dsa-basic-003
  topic: hashing
  difficulty: intermediate
  question: Group a list of words into anagram groups.
  answer: "Approach: Use the sorted letters as a canonical dictionary key; append each word to its group.\n\nWhy it works: Sorting each word creates a canonical representation independent of original letter order; identical keys therefore share a group.\n\nWorked example: \"eat\", \"tea\", and \"ate\" share the sorted key (\"a\", \"e\", \"t\"). This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n m log m); space O(nm), for n words of length at most m.\n\n```python\nfrom collections import defaultdict\ndef group_anagrams(words):\n    groups = defaultdict(list)\n    for word in words:\n        groups[tuple(sorted(word))].append(word)\n    return list(groups.values())\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
