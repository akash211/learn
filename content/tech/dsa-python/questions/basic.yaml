- id: dsa-basic-008
  topic: arrays
  difficulty: intermediate
  question: Rotate an array to the right by k positions in place.
  answer: "Approach: Reduce k modulo n and reverse the full list, then each resulting segment.\n\nWhy it works: Three reversals put the final k-element suffix first while preserving order inside each segment; modulo handles large rotations.\n\nWorked example: Rotating [1,2,3,4,5] by 2 gives [4,5,1,2,3]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); space O(1).\n\n```python\ndef rotate(nums, k):\n    if not nums: return\n    k %= len(nums)\n    def rev(i, j):\n        while i < j:\n            nums[i], nums[j] = nums[j], nums[i]; i += 1; j -= 1\n    rev(0, len(nums)-1); rev(0, k-1); rev(k, len(nums)-1)\n```\n\nImplementation note: Check the empty and boundary cases, and confirm whether the routine mutates its input or excludes returned output from its auxiliary-space bound."
