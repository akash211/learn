- id: dsa-basic-006
  topic: arrays
  difficulty: intermediate
  question: Return the product of all elements except self without division.
  answer: "Approach: Build prefix products in the result, then multiply by a running suffix product.\n\nWhy it works: The first pass stores products strictly to each position’s left; the reverse pass supplies the product strictly to its right, including correct behavior with zeros.\n\nWorked example: For [1, 2, 3, 4], output is [24, 12, 8, 6]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); O(1) auxiliary space excluding output.\n\n```python\ndef product_except_self(nums):\n    out = [1] * len(nums)\n    p = 1\n    for i, x in enumerate(nums):\n        out[i] = p; p *= x\n    s = 1\n    for i in range(len(nums) - 1, -1, -1):\n        out[i] *= s; s *= nums[i]\n    return out\n```\n\nImplementation note: Check the empty and boundary cases, and confirm whether the routine mutates its input or excludes returned output from its auxiliary-space bound."
