- id: dsa-basic-028
  topic: binary search
  difficulty: intermediate
  question: Search a distinct-valued rotated sorted array.
  answer: "Approach: At least one half is sorted; test whether target lies in that half.\n\nWhy it works: At least one half remains sorted; checking its value interval identifies which side may still contain the target.\n\nWorked example: [4,5,6,7,0,1,2] contains 0 at index 4. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(log n); space O(1).\n\n```python\ndef search_rotated(a, target):\n    lo, hi = 0, len(a)-1\n    while lo <= hi:\n        m=(lo+hi)//2\n        if a[m] == target: return m\n        if a[lo] <= a[m]:\n            if a[lo] <= target < a[m]: hi=m-1\n            else: lo=m+1\n        else:\n            if a[m] < target <= a[hi]: lo=m+1\n            else: hi=m-1\n    return -1\n``` Edge cases: a one-element array, or a target equal to `a[lo]`, depends on the `<=` in the sorted-half test; using `<` misclassifies the two-element case. Searching for the pivot first costs two passes for the same O(log n) and wins when you also need the rotation offset; the single pass wins on constant factor and touch count."
  tags:
  - binary-search
- id: dsa-basic-029
  topic: binary search
  difficulty: intermediate
  question: Return the first and last index of target in a sorted array.
  answer: "Approach: Use lower and upper insertion boundaries; upper minus one is the final occurrence.\n\nWhy it works: Lower and upper insertion boundaries bracket every equal value, even when duplicates are adjacent.\n\nWorked example: [1,2,2,2,4] with target 2 returns [1,3]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(log n); space O(1).\n\n```python\nfrom bisect import bisect_left, bisect_right\ndef search_range(nums, target):\n    l=bisect_left(nums,target); r=bisect_right(nums,target)-1\n    return [l,r] if l <= r and nums[l] == target else [-1,-1]\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
