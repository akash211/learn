- id: dsa-basic-001
  topic: arrays
  difficulty: beginner
  question: 'Two Sum: return indices of two values summing to target.'
  answer: "Approach: Scan once; look up the complement among prior indices before recording the current value.\n\nWhy it works: The map stores only prior indices, so each lookup can pair the current item with an earlier one and never reuse an index.\n\nWorked example: nums=[2, 7, 11], target=9 returns [0, 1]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n) expected; space O(n).\n\n```python\ndef two_sum(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target - x in seen:\n            return [seen[target - x], i]\n        seen[x] = i\n    return []\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
