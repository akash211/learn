- id: dsa-basic-027
  topic: binary search
  difficulty: beginner
  question: Find target in a sorted array, returning its index or -1.
  answer: "Approach: Compare the midpoint and discard the half that cannot contain the target.\n\nWhy it works: Each comparison removes a half that cannot contain the target because the array is sorted.\n\nWorked example: Searching [1,3,5,7] for 5 returns index 2. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(log n); space O(1).\n\n```python\ndef binary_search(nums, target):\n    lo, hi = 0, len(nums)-1\n    while lo <= hi:\n        mid = (lo+hi)//2\n        if nums[mid] == target: return mid\n        if nums[mid] < target: lo = mid+1\n        else: hi = mid-1\n    return -1\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
  tags:
