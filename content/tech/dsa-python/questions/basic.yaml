- id: dsa-basic-004
  topic: sliding window
  difficulty: intermediate
  question: Find the length of the longest substring without repeated characters.
  answer: "Approach: Track each character’s latest index and move the left boundary past a repeat.\n\nWhy it works: The left boundary only moves forward, and max prevents an old repeated index outside the active window from invalidating it.\n\nWorked example: For \"abba\", the best window has length 2, not 3. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n) expected; space O(min(n, alphabet)).\n\n```python\ndef longest_unique(s):\n    last = {}; left = best = 0\n    for right, ch in enumerate(s):\n        left = max(left, last.get(ch, -1) + 1)\n        last[ch] = right\n        best = max(best, right - left + 1)\n    return best\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
