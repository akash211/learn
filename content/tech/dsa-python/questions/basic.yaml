- id: dsa-basic-002
  topic: strings
  difficulty: beginner
  question: How do you determine whether two strings are anagrams?
  answer: "Approach: Compare character frequency maps; both strings must have the same length and counts.\n\nWhy it works: Equal character multiplicities are both necessary and sufficient for rearrangement; Counter handles arbitrary hashable code points.\n\nWorked example: \"listen\" and \"silent\" have identical frequency maps. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n) expected; space O(u), for u distinct characters.\n\n```python\nfrom collections import Counter\ndef is_anagram(s, t):\n    return Counter(s) == Counter(t)\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable.\n\nImplementation note: Check the empty and boundary cases, and confirm whether the routine mutates its input or excludes returned output from its auxiliary-space bound."
