- id: dsa-basic-007
  topic: two pointers
  difficulty: intermediate
  question: Return all unique triplets whose sum is zero.
  answer: "Approach: Sort, fix one value, then use opposing pointers; skip duplicate values after matches.\n\nWhy it works: After sorting, pointer movement is justified by sum order; skipping equal fixed values and matched endpoints removes duplicate triplets.\n\nWorked example: [-1, 0, 1, 2, -1, -4] yields [-1,-1,2] and [-1,0,1]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n^2); space O(n) for the sorted copy, excluding returned triplets.\n\n```python\ndef three_sum(nums):\n    a = sorted(nums); out = []\n    for i in range(len(a) - 2):\n        if i and a[i] == a[i-1]: continue\n        l, r = i + 1, len(a) - 1\n        while l < r:\n            s = a[i] + a[l] + a[r]\n            if s < 0: l += 1\n            elif s > 0: r -= 1\n            else:\n                out.append([a[i], a[l], a[r]])\n                l += 1; r -= 1\n                while l < r and a[l] == a[l-1]: l += 1\n                while l < r and a[r] == a[r+1]: r -=\
    \ 1\n    return out\n```"
