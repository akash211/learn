- id: dsa-basic-005
  topic: arrays
  difficulty: intermediate
  question: Find the maximum sum of a non-empty contiguous subarray.
  answer: "Approach: Kadane’s recurrence either starts anew at x or extends the previous best-ending sum.\n\nWhy it works: At each position, every best subarray ending there either starts at that item or extends the previous ending; tracking the global best handles all endpoints.\n\nWorked example: For [-2, 3, -1], the best sum is 3. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); space O(1).\n\n```python\ndef max_subarray(nums):\n    ending = best = nums[0]\n    for x in nums[1:]:\n        ending = max(x, ending + x)\n        best = max(best, ending)\n    return best\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
