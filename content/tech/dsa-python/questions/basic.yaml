- id: dsa-basic-011
  topic: stack
  difficulty: intermediate
  question: Implement a stack that supports push, pop, top, and retrieving minimum in O(1).
  answer: "Approach: Maintain a parallel stack of minima, repeating the current minimum at every depth.\n\nWhy it works: Each depth stores its prefix minimum, so popping data and minima together restores the exact prior stack state.\n\nWorked example: Push 5, then 2: get_min is 2; pop restores 5. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Each operation O(1); space O(n).\n\n```python\nclass MinStack:\n    def __init__(self): self.data = []; self.mins = []\n    def push(self, x):\n        self.data.append(x); self.mins.append(x if not self.mins else min(x, self.mins[-1]))\n    def pop(self): self.mins.pop(); return self.data.pop()\n    def top(self): return self.data[-1]\n    def get_min(self): return self.mins[-1]\n``` Edge cases: a repeated minimum must survive one pop, and an empty stack should raise rather than return a sentinel. The parallel stack costs O(n) extra memory; the alternative, one stack of (value, minimum) pairs, stores the same information with no second list. Both stay O(1) because each push computes its minimum once from the entry below instead of rescanning."
  tags:
  - stack
- id: dsa-basic-012
  topic: monotonic stack
  difficulty: intermediate
  question: For each day, find how many days until a warmer temperature.
  answer: "Approach: Keep unresolved indices on a decreasing stack; a warmer day resolves the top.\n\nWhy it works: A warmer day resolves every colder unresolved index it pops; the stack retains exactly those indices without a known warmer successor.\n\nWorked example: [73,74,75,71,69,72,76,73] starts with answer 1. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); space O(n).\n\n```python\ndef daily_temperatures(t):\n    ans = [0] * len(t); st = []\n    for i, x in enumerate(t):\n        while st and t[st[-1]] < x:\n            j = st.pop(); ans[j] = i - j\n        st.append(i)\n    return ans\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
  tags:
  - monotonic-stack
- id: dsa-basic-013
  topic: queue
  difficulty: intermediate
  question: Implement a FIFO queue using two stacks.
  answer: "Approach: Push into input; transfer to output only when output is empty, reversing arrival order.\n\nWhy it works: Transferring only into an empty output stack reverses arrival order once and preserves FIFO order for subsequent operations.\n\nWorked example: Push 1, push 2, then pop returns 1. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Amortized O(1) per operation; O(n) space.\n\n```python\nclass MyQueue:\n    def __init__(self): self.ins = []; self.outs = []\n    def push(self, x): self.ins.append(x)\n    def _move(self):\n        if not self.outs:\n            while self.ins: self.outs.append(self.ins.pop())\n    def pop(self): self._move(); return self.outs.pop()\n    def peek(self): self._move(); return self.outs[-1]\n    def empty(self): return not self.ins and not self.outs\n``` Edge cases: popping an empty queue must fail cleanly, and a push arriving mid-drain still goes to input, so ordering survives. Each element crosses the stacks at most once, which is why the bound is amortized rather than worst case. `collections.deque` gives true O(1) worst case and wins when one slow pop would break a latency budget."
  tags:
  - queue
- id: dsa-basic-014
  topic: linked list
  difficulty: intermediate
  question: Reverse a singly linked list.
  answer: "Approach: Iteratively redirect each next pointer while retaining the untouched suffix.\n\nWhy it works: Each iteration transfers one edge from the untouched suffix to the reversed prefix without losing the saved successor.\n\nWorked example: 1→2→3 becomes 3→2→1. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); space O(1).\n\n```python\nclass Node:\n    def __init__(self, val=0, next=None): self.val, self.next = val, next\ndef reverse_list(head):\n    prev = None\n    while head:\n        nxt = head.next; head.next = prev; prev = head; head = nxt\n    return prev\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
  tags:
  - linked-list
- id: dsa-basic-015
  topic: linked list
  difficulty: intermediate
  question: Merge two sorted linked lists.
  answer: "Approach: Attach the smaller current node to a dummy-tail, then append the remainder.\n\nWhy it works: Choosing the smaller head preserves sorted order, and each original node is attached exactly once.\n\nWorked example: Merging 1→3 and 2→4 produces 1→2→3→4. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(m+n); O(1) auxiliary space when relinking nodes.\n\n```python\nclass Node:\n    def __init__(self, val=0, next=None): self.val, self.next = val, next\ndef merge_lists(a, b):\n    dummy = tail = Node()\n    while a and b:\n        if a.val <= b.val: tail.next, a = a, a.next\n        else: tail.next, b = b, b.next\n        tail = tail.next\n    tail.next = a or b\n    return dummy.next\n```"
  tags:
  - linked-list
- id: dsa-basic-016
  topic: linked list
  difficulty: beginner
  question: Detect whether a linked list contains a cycle.
  answer: "Approach: Advance slow by one and fast by two; a meeting proves a cycle.\n\nWhy it works: On a cycle the fast pointer gains one node per iteration relative to slow, so finite cycle length forces a meeting.\n\nWorked example: A tail pointing back to the second node eventually makes slow is fast. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); space O(1).\n\n```python\ndef has_cycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next; fast = fast.next.next\n        if slow is fast: return True\n    return False\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
  tags:
  - linked-list
- id: dsa-basic-017
  topic: linked list
  difficulty: intermediate
  question: Remove the nth node from the end of a list, assuming 1 <= n <= its length.
  answer: "Approach: A dummy node and n-step lead pointer leave slow immediately before the target.\n\nWhy it works: The fixed pointer gap makes slow stop at the predecessor of the target, including head removal via the dummy node.\n\nWorked example: In 1→2→3→4 with n=2, remove 3. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); space O(1).\n\n```python\nclass Node:\n    def __init__(self, val=0, next=None): self.val, self.next = val, next\ndef remove_nth(head, n):\n    dummy = Node(0, head); fast = slow = dummy\n    for _ in range(n): fast = fast.next\n    while fast.next: fast = fast.next; slow = slow.next\n    slow.next = slow.next.next\n    return dummy.next\n``` Edge cases: n equal to the list length removes the head, which only works because the dummy node gives slow a real predecessor to relink. The list is walked once and its length is never computed. A count-first two-pass version is easier to explain and wins when the length is needed anyway; the gap version wins on streamed input where a second traversal is impossible."
  tags:
  - linked-list
- id: dsa-basic-018
  topic: linked list
  difficulty: intermediate
  question: Determine whether a linked list is a palindrome.
  answer: "Approach: Find midpoint, reverse second half, and compare corresponding values.\n\nWhy it works: After locating the midpoint, reversing the second half aligns corresponding values without allocating another sequence.\n\nWorked example: 1→2→2→1 compares equal from both ends. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); space O(1), mutates the second half temporarily.\n\n```python\nclass Node:\n    def __init__(self, val=0, next=None): self.val, self.next = val, next\ndef is_list_palindrome(head):\n    slow = fast = head\n    while fast and fast.next: slow = slow.next; fast = fast.next.next\n    prev = None\n    while slow:\n        nxt = slow.next; slow.next = prev; prev = slow; slow = nxt\n    left, right = head, prev\n    while right:\n        if left.val != right.val: return False\n        left = left.next; right = right.next\n    return True\n```"
  tags:
  - linked-list
- id: dsa-basic-019
  topic: trees
  difficulty: beginner
  question: Find the maximum depth of a binary tree.
  answer: "Approach: Recursively take one plus the larger child depth, with empty depth zero.\n\nWhy it works: Every nonempty node contributes one level above the deeper child; the empty subtree establishes the zero-depth base case.\n\nWorked example: A root with one child and no grandchildren has depth 2. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); recursion space O(h).\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None): self.val, self.left, self.right = val, left, right\ndef max_depth(root):\n    if root is None: return 0\n    return 1 + max(max_depth(root.left), max_depth(root.right))\n```\n\nImplementation note: Test the smallest input and a duplicate or boundary case, and check that the returned values match the stated contract. The stated complexity includes the main traversal; returned output storage is separate when applicable."
  tags:
  - trees
- id: dsa-basic-020
  topic: trees
  difficulty: beginner
  question: Check whether two binary trees are identical in shape and values.
  answer: "Approach: Both empty is equal; otherwise compare values and corresponding subtrees.\n\nWhy it works: The recursive comparison checks both shape and value at each corresponding position, so local equality composes to whole-tree equality.\n\nWorked example: Two empty trees are equal; a missing child on only one side is not. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); recursion space O(h).\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None): self.val, self.left, self.right = val, left, right\ndef same_tree(a, b):\n    if a is None or b is None: return a is b\n    return a.val == b.val and same_tree(a.left,b.left) and same_tree(a.right,b.right)\n``` Edge cases: one side None fails before any value comparison, and two empty trees are equal through the `a is b` test. Space is O(h), which becomes O(n) on a degenerate chain and can exceed Python's recursion limit. An explicit stack of node pairs has the same complexity, survives adversarial shapes, and wins when input depth is untrusted."
  tags:
  - trees
- id: dsa-basic-021
  topic: trees
  difficulty: intermediate
  question: Return binary-tree level-order traversal as lists of values.
  answer: "Approach: Process the queue length captured at the start of each level.\n\nWhy it works: Capturing the queue size before processing prevents newly enqueued children from leaking into the current level.\n\nWorked example: A tree 1 with children 2 and 3 returns [[1],[2,3]]. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); space O(w) queue plus O(n) output.\n\n```python\nfrom collections import deque\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None): self.val, self.left, self.right = val, left, right\ndef level_order(root):\n    if not root: return []\n    q = deque([root]); out = []\n    while q:\n        row = []\n        for _ in range(len(q)):\n            node = q.popleft(); row.append(node.val)\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n        out.append(row)\n    return out\n```"
  tags:
  - trees
- id: dsa-basic-022
  topic: BST
  difficulty: intermediate
  question: Validate that a binary tree is a strict binary search tree.
  answer: "Approach: Pass exclusive lower and upper bounds to every subtree.\n\nWhy it works: Ancestor bounds propagate through the full subtree, catching violations that a parent-child-only test misses.\n\nWorked example: Root 5 with left child 3 and deeper right descendant 6 is invalid. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n); recursion space O(h).\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None): self.val, self.left, self.right = val, left, right\ndef is_valid_bst(root):\n    def check(node, lo, hi):\n        if not node: return True\n        if lo is not None and node.val <= lo: return False\n        if hi is not None and node.val >= hi: return False\n        return check(node.left, lo, node.val) and check(node.right, node.val, hi)\n    return check(root, None, None)\n```"
  tags:
  - BST
- id: dsa-basic-023
  topic: BST
  difficulty: intermediate
  question: Find the kth-smallest key in a BST (assume 1 <= k <= node count).
  answer: "Approach: Inorder traversal visits keys in sorted order; stop at visit k.\n\nWhy it works: Inorder traversal of a strict BST is sorted; stopping at visit k avoids traversing the remaining nodes.\n\nWorked example: For keys 2,1,3 and k=2, inorder visits 1 then returns 2. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(h+k) in the iterative traversal; space O(h).\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None): self.val, self.left, self.right = val, left, right\ndef kth_smallest(root, k):\n    st = []; node = root\n    while True:\n        while node: st.append(node); node = node.left\n        node = st.pop(); k -= 1\n        if k == 0: return node.val\n        node = node.right\n```"
  tags:
  - BST
- id: dsa-basic-024
  topic: BST
  difficulty: intermediate
  question: Find the lowest common ancestor of two values in a BST; both exist.
  answer: "Approach: Descend left or right while both targets lie on the same side; otherwise current splits them.\n\nWhy it works: The first node not strictly above or below both targets is the lowest point where their search paths diverge.\n\nWorked example: In a BST rooted at 6, values 2 and 8 split at 6. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(h); space O(1).\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None): self.val, self.left, self.right = val, left, right\ndef bst_lca(root, p, q):\n    while root:\n        if p < root.val and q < root.val: root = root.left\n        elif p > root.val and q > root.val: root = root.right\n        else: return root\n    return None\n```"
  tags:
  - BST
- id: dsa-basic-025
  topic: heap
  difficulty: intermediate
  question: Return the k most frequent values; ties may be in any order.
  answer: "Approach: Count values, then use a size-k min-heap keyed by frequency.\n\nWhy it works: Counter computes exact frequencies; nlargest selects the highest counts while ties may be returned in any order.\n\nWorked example: For [1,1,1,2,2,3] and k=2, values 1 and 2 are returned. This small trace checks the boundary behavior as well as the normal path.\n\nComplexity: Time O(n + u log k); space O(u), u distinct values.\n\n```python\nfrom collections import Counter\nimport heapq\ndef top_k_frequent(nums, k):\n    return [x for x, _ in heapq.nlargest(k, Counter(nums).items(), key=lambda p:p[1])]\n```\n\nImplementation note: Check the empty and boundary cases, and confirm whether the routine mutates its input or excludes returned output from its auxiliary-space bound."
  tags:
